name: 'Deputy Diff'
description: 'Show exactly what dependencies changed in PRs. Highlights added, removed, and updated packages with vulnerability and license analysis.'
author: 'temporalio'

branding:
  icon: 'git-pull-request'
  color: 'purple'

inputs:
  # Diff configuration
  base:
    description: 'Base reference (default: auto-detect from PR or "main")'
    required: false
    default: ''
  target:
    description: 'Target reference to compare against base'
    required: false
    default: 'HEAD'
  repo:
    description: 'Repository path'
    required: false
    default: '.'

  # Analysis options
  skip-vuln-scan:
    description: 'Skip vulnerability scanning of changes'
    required: false
    default: 'false'
  licenses:
    description: 'Include license information'
    required: false
    default: 'true'

  # Policy
  policy:
    description: 'Policy file(s) for evaluation (comma-separated)'
    required: false
    default: ''

  # GitHub integration
  comment-on-pr:
    description: 'Add comment to PR with diff summary'
    required: false
    default: 'true'
  github-token:
    description: 'Token for PR comments and API access'
    required: false
    default: ${{ github.token }}

  # Behavior
  fail-on-new-vulnerabilities:
    description: 'Fail if new vulnerabilities are introduced'
    required: false
    default: 'true'

outputs:
  added-count:
    description: 'Number of dependencies added'
    value: ${{ steps.diff.outputs.added-count }}
  removed-count:
    description: 'Number of dependencies removed'
    value: ${{ steps.diff.outputs.removed-count }}
  updated-count:
    description: 'Number of dependencies updated (upgraded, downgraded, or otherwise changed)'
    value: ${{ steps.diff.outputs.updated-count }}
  new-vulnerabilities:
    description: 'Number of vulnerabilities newly introduced by the change set'
    value: ${{ steps.diff.outputs.new-vulnerabilities }}
  policy-denials:
    description: 'Number of policy deny results'
    value: ${{ steps.diff.outputs.policy-denials }}
  policy-warnings:
    description: 'Number of policy warn results'
    value: ${{ steps.diff.outputs.policy-warnings }}
  json-path:
    description: 'Path to the full structured diff (deputy diff --format json output) for custom processing'
    value: ${{ steps.diff.outputs.json-path }}
  summary:
    description: 'Markdown summary of changes (base64 encoded and bounded for GitHub Actions output limits)'
    value: ${{ steps.summary.outputs.result }}

runs:
  using: 'composite'
  steps:
    - name: Determine base ref
      id: refs
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        # Determine which ref to use as base
        if [ -n "$INPUT_BASE" ]; then
          BASE_REF="$INPUT_BASE"
        elif [ "$EVENT_NAME" = "pull_request" ]; then
          BASE_REF="$PR_BASE_SHA"
        else
          BASE_REF="main"
        fi

        # Validate ref doesn't contain dangerous characters
        if [[ "$BASE_REF" =~ [^a-zA-Z0-9._/-] ]]; then
          echo "::error::Invalid base ref: contains disallowed characters"
          exit 1
        fi

        echo "base=$BASE_REF" >> "$GITHUB_OUTPUT"
        echo "Using base ref: $BASE_REF"

    - name: Fetch base commit for PR
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        # For PRs, ensure we have the base commit available
        # This is more efficient than fetch-depth: 0 (full history)
        if ! git cat-file -e "$PR_BASE_SHA" 2>/dev/null; then
          echo "Fetching base commit $PR_BASE_SHA..."
          git fetch --depth=1 origin "$PR_BASE_SHA"
        else
          echo "Base commit $PR_BASE_SHA already available"
        fi

    - name: Run Deputy Diff
      id: diff
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_SKIP_VULN_SCAN: ${{ inputs.skip-vuln-scan }}
        INPUT_LICENSES: ${{ inputs.licenses }}
        INPUT_POLICY: ${{ inputs.policy }}
        BASE_REF: ${{ steps.refs.outputs.base }}
      run: |
        set -euo pipefail

        DIFF_JSON="$RUNNER_TEMP/deputy-diff.json"
        COMMENT_MD="$RUNNER_TEMP/deputy-diff.md"

        # One scan produces the structured contract (deputy.diff.v1 as JSON);
        # counts, the PR comment, and the job summary all derive from that
        # file. Nothing below parses rendered text.
        ARGS=(diff "$BASE_REF" "$INPUT_TARGET" --format json --output "$DIFF_JSON")

        if [ "$INPUT_REPO" != "." ]; then
          ARGS+=(--repo "$INPUT_REPO")
        fi

        if [ "$INPUT_SKIP_VULN_SCAN" = "true" ]; then
          ARGS+=(--skip-vuln-scan)
        fi

        if [ "$INPUT_LICENSES" = "true" ]; then
          ARGS+=(--licenses)
        fi

        # Add policy files if specified
        if [ -n "$INPUT_POLICY" ]; then
          IFS=',' read -ra POLICIES <<< "$INPUT_POLICY"
          for policy in "${POLICIES[@]}"; do
            ARGS+=(--policy "$policy")
          done
        fi

        echo "Running: deputy ${ARGS[*]}"

        # A policy deny exits non-zero after the JSON is written, so the
        # structured output is available either way; only a missing output
        # file is a hard failure.
        set +e
        deputy "${ARGS[@]}"
        EXIT_CODE=$?
        set -e
        echo "DIFF_EXIT_CODE=$EXIT_CODE" >> "$GITHUB_ENV"

        if [ ! -s "$DIFF_JSON" ]; then
          echo "::error::deputy diff produced no output (exit code $EXIT_CODE)"
          exit "$EXIT_CODE"
        fi

        # Zero-valued fields are omitted by the JSON contract, hence // 0.
        ADDED=$(jq -r '.change_stats.added_count // 0' "$DIFF_JSON")
        REMOVED=$(jq -r '.change_stats.removed_count // 0' "$DIFF_JSON")
        UPDATED=$(jq -r '(.change_stats.upgraded_count // 0) + (.change_stats.downgraded_count // 0) + (.change_stats.updated_count // 0)' "$DIFF_JSON")
        NEW_VULNS=$(jq -r '.stats.added_count // 0' "$DIFF_JSON")
        POLICY_DENIALS=$(jq -r '[.policy_actions[]? | select(.type == "ACTION_TYPE_DENY")] | length' "$DIFF_JSON")
        POLICY_WARNINGS=$(jq -r '[.policy_actions[]? | select(.type == "ACTION_TYPE_WARN")] | length' "$DIFF_JSON")

        {
          echo "added-count=${ADDED}"
          echo "removed-count=${REMOVED}"
          echo "updated-count=${UPDATED}"
          echo "new-vulnerabilities=${NEW_VULNS}"
          echo "policy-denials=${POLICY_DENIALS}"
          echo "policy-warnings=${POLICY_WARNINGS}"
          echo "json-path=${DIFF_JSON}"
        } >> "$GITHUB_OUTPUT"

        # Render the PR comment / job summary markdown from the same file.
        deputy diff --from-json "$DIFF_JSON" --format markdown --output "$COMMENT_MD"
        echo "DIFF_COMMENT_PATH=$COMMENT_MD" >> "$GITHUB_ENV"

        # Log the report for humans reading the run output.
        cat "$COMMENT_MD"

        # Surface policy findings as annotations, named by their rules.
        jq -r '.policy_actions[]? | select(.type == "ACTION_TYPE_DENY")
          | "::error::policy deny (\(.policy_name // "?")::\(.rule_name // "?")): \(.reason // .message // "denied")"' "$DIFF_JSON"
        if [ "${POLICY_WARNINGS}" -gt 0 ]; then
          echo "::warning::${POLICY_WARNINGS} policy warning(s); see the job summary for details"
        fi
        if [ "${NEW_VULNS}" -gt 0 ]; then
          echo "::warning::Found ${NEW_VULNS} new vulnerabilities in changed dependencies"
        fi

    - name: Export Markdown summary
      id: summary
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
      env:
        DEPUTY_ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.github-token }}
        result-encoding: string
        script: |
          const fs = require('fs');
          const path = require('path');
          const { encodeMarkdownOutput } = require(path.join(process.env.DEPUTY_ACTION_PATH, 'truncate-comment.js'));

          // GitHub estimates the 1 MB per-job output limit using UTF-16.
          // Leave headroom for the action's other outputs.
          const maxOutputBytes = 800000;
          return encodeMarkdownOutput(fs.readFileSync(process.env.DIFF_COMMENT_PATH, 'utf8'), maxOutputBytes);

    - name: Comment on PR
      if: inputs.comment-on-pr == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
      env:
        DEPUTY_ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const path = require('path');
          const { truncateMarkdown } = require(path.join(process.env.DEPUTY_ACTION_PATH, 'truncate-comment.js'));

          // Fixed marker for idempotent upsert: updates patch the existing
          // comment in place instead of posting a new one per push.
          const marker = '<!-- deputy:diff -->';
          const footer = '\n\n<sub>Generated by [Deputy](https://github.com/temporalio/deputy)</sub>';

          let report = 'No changes detected';
          const reportPath = process.env.DIFF_COMMENT_PATH || '';
          if (reportPath && fs.existsSync(reportPath)) {
            report = fs.readFileSync(reportPath, 'utf-8');
          }

          // Keep complete Markdown lines and close any details block before
          // pointing at the job summary, which carries the full report.
          const maxBodyBytes = 60000;
          report = truncateMarkdown(report, maxBodyBytes);

          const body = marker + '\n' + report + footer;

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          // Match by marker, falling back to the heading for comments
          // posted by older versions of this action.
          const botComment = comments.find(comment =>
            comment.user.type === 'Bot' &&
            (comment.body.includes(marker) || comment.body.includes('## Deputy Dependency Diff'))
          );

          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: body
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
          }
      continue-on-error: true

    - name: Check failure conditions
      shell: bash
      env:
        INPUT_FAIL_ON_NEW_VULNS: ${{ inputs.fail-on-new-vulnerabilities }}
        NEW_VULNS: ${{ steps.diff.outputs.new-vulnerabilities }}
      run: |
        EXIT_CODE="${DIFF_EXIT_CODE:-0}"

        if [ "$INPUT_FAIL_ON_NEW_VULNS" = "true" ]; then
          if [ "${NEW_VULNS:-0}" -gt 0 ]; then
            echo "::error::$NEW_VULNS new vulnerabilities introduced"
            exit 1
          fi

          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Deputy diff failed (exit code $EXIT_CODE)"
            exit 1
          fi
        fi

        echo "Diff completed successfully"

    - name: Write job summary
      if: always()
      shell: bash
      run: |
        if [ -n "${DIFF_COMMENT_PATH:-}" ] && [ -s "${DIFF_COMMENT_PATH:-}" ]; then
          cat "$DIFF_COMMENT_PATH" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "Deputy diff produced no report (see the run log)." >> "$GITHUB_STEP_SUMMARY"
        fi
