name: 'Deputy Diff'
description: 'Show exactly what dependencies changed in PRs. Highlights added, removed, and updated packages with vulnerability and license analysis.'
author: 'picatz'

branding:
  icon: 'git-pull-request'
  color: 'purple'

inputs:
  # Diff configuration
  base:
    description: 'Base reference (default: auto-detect from PR or "main")'
    required: false
    default: ''
  target:
    description: 'Target reference to compare against base'
    required: false
    default: 'HEAD'
  repo:
    description: 'Repository path'
    required: false
    default: '.'

  # Analysis options
  skip-vuln-scan:
    description: 'Skip vulnerability scanning of changes'
    required: false
    default: 'false'
  licenses:
    description: 'Include license information'
    required: false
    default: 'true'

  # Policy
  policy:
    description: 'Policy file(s) for evaluation (comma-separated)'
    required: false
    default: ''

  # GitHub integration
  comment-on-pr:
    description: 'Add comment to PR with diff summary'
    required: false
    default: 'true'
  github-token:
    description: 'Token for PR comments and API access'
    required: false
    default: ${{ github.token }}

  # Behavior
  fail-on-new-vulnerabilities:
    description: 'Fail if new vulnerabilities are introduced'
    required: false
    default: 'true'

outputs:
  added-count:
    description: 'Number of dependencies added'
    value: ${{ steps.diff.outputs.added-count }}
  removed-count:
    description: 'Number of dependencies removed'
    value: ${{ steps.diff.outputs.removed-count }}
  updated-count:
    description: 'Number of dependencies updated'
    value: ${{ steps.diff.outputs.updated-count }}
  new-vulnerabilities:
    description: 'Number of new vulnerabilities introduced'
    value: ${{ steps.diff.outputs.new-vulnerabilities }}
  summary:
    description: 'Text summary of changes (base64 encoded to handle special characters)'
    value: ${{ steps.diff.outputs.summary_base64 }}

runs:
  using: 'composite'
  steps:
    - name: Determine base ref
      id: refs
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        # Determine which ref to use as base
        if [ -n "$INPUT_BASE" ]; then
          BASE_REF="$INPUT_BASE"
        elif [ "$EVENT_NAME" = "pull_request" ]; then
          BASE_REF="$PR_BASE_SHA"
        else
          BASE_REF="main"
        fi

        # Validate ref doesn't contain dangerous characters
        if [[ "$BASE_REF" =~ [^a-zA-Z0-9._/-] ]]; then
          echo "::error::Invalid base ref: contains disallowed characters"
          exit 1
        fi

        echo "base=$BASE_REF" >> "$GITHUB_OUTPUT"
        echo "Using base ref: $BASE_REF"

    - name: Fetch base commit for PR
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        # For PRs, ensure we have the base commit available
        # This is more efficient than fetch-depth: 0 (full history)
        if ! git cat-file -e "$PR_BASE_SHA" 2>/dev/null; then
          echo "Fetching base commit $PR_BASE_SHA..."
          git fetch --depth=1 origin "$PR_BASE_SHA"
        else
          echo "Base commit $PR_BASE_SHA already available"
        fi

    - name: Run Deputy Diff
      id: diff
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_SKIP_VULN_SCAN: ${{ inputs.skip-vuln-scan }}
        INPUT_LICENSES: ${{ inputs.licenses }}
        INPUT_POLICY: ${{ inputs.policy }}
        BASE_REF: ${{ steps.refs.outputs.base }}
        # Force colored output in CI for better readability in logs
        CLICOLOR_FORCE: '1'
      run: |
        set -euo pipefail

        # Build command arguments as array (safer than string concatenation)
        ARGS=(diff "$BASE_REF" "$INPUT_TARGET")

        if [ "$INPUT_REPO" != "." ]; then
          ARGS+=(--repo "$INPUT_REPO")
        fi

        if [ "$INPUT_SKIP_VULN_SCAN" = "true" ]; then
          ARGS+=(--skip-vuln-scan)
        fi

        if [ "$INPUT_LICENSES" = "true" ]; then
          ARGS+=(--licenses)
        fi

        # Add policy files if specified
        if [ -n "$INPUT_POLICY" ]; then
          IFS=',' read -ra POLICIES <<< "$INPUT_POLICY"
          for policy in "${POLICIES[@]}"; do
            ARGS+=(--policy "$policy")
          done
        fi

        echo "Running: deputy ${ARGS[*]}"

        # Capture output
        set +e
        OUTPUT=$(deputy "${ARGS[@]}" 2>&1)
        EXIT_CODE=$?
        set -e

        echo "$OUTPUT"

        # Parse output for dependency change counts
        # Deputy output uses: + (added), - (removed), ↑ (upgraded), ↓ (downgraded)
        # Strip ANSI escape codes for parsing (colors may be present due to CLICOLOR_FORCE)
        PLAIN_OUTPUT=$(echo "$OUTPUT" | sed 's/\x1b\[[0-9;]*m//g')

        # Use explicit default values since grep -c returns empty on no match with || true
        ADDED=$(echo "$PLAIN_OUTPUT" | grep -cE '^\s*\+ ' 2>/dev/null || echo "0")
        REMOVED=$(echo "$PLAIN_OUTPUT" | grep -cE '^\s*- ' 2>/dev/null || echo "0")
        # Count upgrades and downgrades (lines starting with ↑ or ↓)
        UPDATED=$(echo "$PLAIN_OUTPUT" | grep -cE '^\s*(↑|↓) ' 2>/dev/null || echo "0")

        # Count new vulnerabilities by looking for primary vulnerability entries (lines starting with •)
        # This avoids double-counting aliases which appear on separate "Aliases:" lines
        # Format: "  • CVE-2025-13425 [LOW] ..." or "  • GHSA-xxxx-xxxx-xxxx [HIGH] ..."
        NEW_VULNS=$(echo "$PLAIN_OUTPUT" | grep -cE '^\s*• (CVE-[0-9]{4}-[0-9]+|GHSA-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}|GO-[0-9]{4}-[0-9]+)' 2>/dev/null || echo "0")
        NEW_VULNS="${NEW_VULNS:-0}"

        echo "added-count=${ADDED}" >> "$GITHUB_OUTPUT"
        echo "removed-count=${REMOVED}" >> "$GITHUB_OUTPUT"
        echo "updated-count=${UPDATED}" >> "$GITHUB_OUTPUT"
        echo "new-vulnerabilities=${NEW_VULNS}" >> "$GITHUB_OUTPUT"

        # Save summary for PR comment
        # Use base64 encoding to safely pass multiline output with special characters
        # through GitHub Actions outputs (avoids heredoc parsing issues with Unicode)
        # Note: Use tr -d '\n' for portability (GNU base64 uses -w 0, BSD uses -b 0)
        SUMMARY_BASE64=$(printf '%s' "$OUTPUT" | base64 | tr -d '\n')
        echo "summary_base64=${SUMMARY_BASE64}" >> "$GITHUB_OUTPUT"

        # Also save as environment variable for the comment step
        # Using base64 avoids issues with special characters in GITHUB_ENV
        echo "DIFF_SUMMARY_BASE64=${SUMMARY_BASE64}" >> "$GITHUB_ENV"

        echo "DIFF_EXIT_CODE=$EXIT_CODE" >> "$GITHUB_ENV"

        # Use numeric comparison with default value
        if [ "${NEW_VULNS:-0}" -gt 0 ]; then
          echo "::warning::Found $NEW_VULNS vulnerabilities in changed dependencies"
        fi

    - name: Comment on PR
      if: inputs.comment-on-pr == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          // Decode base64 summary (avoids issues with special characters)
          const summaryBase64 = process.env.DIFF_SUMMARY_BASE64 || '';
          let summary = 'No changes detected';
          if (summaryBase64) {
            try {
              summary = Buffer.from(summaryBase64, 'base64').toString('utf-8');
            } catch (e) {
              console.log('Failed to decode summary:', e);
            }
          }

          // Find existing comment
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const botComment = comments.find(comment =>
            comment.user.type === 'Bot' &&
            comment.body.includes('## Deputy Dependency Diff')
          );

          const body = `## Deputy Dependency Diff

\`\`\`
${summary}
\`\`\`

<sub>Generated by [Deputy](https://github.com/picatz/deputy)</sub>`;

          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: body
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
          }
      continue-on-error: true

    - name: Check failure conditions
      shell: bash
      env:
        INPUT_FAIL_ON_NEW_VULNS: ${{ inputs.fail-on-new-vulnerabilities }}
        NEW_VULNS: ${{ steps.diff.outputs.new-vulnerabilities }}
      run: |
        EXIT_CODE="${DIFF_EXIT_CODE:-0}"

        if [ "$INPUT_FAIL_ON_NEW_VULNS" = "true" ]; then
          if [ "$NEW_VULNS" -gt 0 ]; then
            echo "::error::$NEW_VULNS new vulnerabilities introduced"
            exit 1
          fi

          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Deputy diff failed (exit code $EXIT_CODE)"
            exit 1
          fi
        fi

        echo "Diff completed successfully"

    - name: Write job summary
      if: always()
      shell: bash
      env:
        ADDED: ${{ steps.diff.outputs.added-count }}
        REMOVED: ${{ steps.diff.outputs.removed-count }}
        UPDATED: ${{ steps.diff.outputs.updated-count }}
        NEW_VULNS: ${{ steps.diff.outputs.new-vulnerabilities }}
      run: |
        {
          echo "## Deputy Dependency Diff"
          echo ""
          echo "| Change Type | Count |"
          echo "|-------------|-------|"
          echo "| Added | ${ADDED:-0} |"
          echo "| Removed | ${REMOVED:-0} |"
          echo "| Updated | ${UPDATED:-0} |"
          echo "| New Vulnerabilities | ${NEW_VULNS:-0} |"
          echo ""
          if [ "${NEW_VULNS:-0}" -gt 0 ]; then
            echo "> :warning: New vulnerabilities were introduced"
          elif [ "${ADDED:-0}" -eq 0 ] && [ "${REMOVED:-0}" -eq 0 ] && [ "${UPDATED:-0}" -eq 0 ]; then
            echo "> No dependency changes detected"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
