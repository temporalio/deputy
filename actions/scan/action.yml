name: 'Deputy Scan'
description: 'Detect vulnerabilities with CEL-powered policies. Uploads SARIF to GitHub Security tab. Supports Go, npm, Python, Maven, and more.'
author: 'temporalio'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  # Target configuration
  target:
    description: 'Path to scan (default: current directory)'
    required: false
    default: '.'
  ref:
    description: 'Git reference to scan (branch, tag, or commit)'
    required: false
    default: 'HEAD'
  ecosystems:
    description: 'Ecosystems to scan (comma-separated: go,npm,pypi,maven,etc.)'
    required: false
    default: 'all'

  # Output configuration
  format:
    description: 'Output format (sarif, json, text)'
    required: false
    default: 'sarif'
  output:
    description: 'Output file path'
    required: false
    default: 'deputy-results.sarif'

  # Filtering
  ignore-unfixed:
    description: 'Ignore vulnerabilities without fixes'
    required: false
    default: 'false'

  # Policy
  policy:
    description: 'Path to policy file(s) for evaluation (comma-separated)'
    required: false
    default: ''

  # GitHub integration
  upload-sarif:
    description: 'Upload SARIF to GitHub Security tab'
    required: false
    default: 'true'
  sarif-category:
    description: 'Category for SARIF results (unique per scan type)'
    required: false
    default: 'deputy-scan'
  github-token:
    description: 'Token for SARIF upload and API access'
    required: false
    default: ${{ github.token }}

  # Behavior
  fail-on-findings:
    description: 'Fail action if vulnerabilities are found'
    required: false
    default: 'false'
  fail-on-policy-violation:
    description: 'Fail action if policy violations are found'
    required: false
    default: 'true'

outputs:
  sarif:
    description: 'Path to SARIF output file'
    value: ${{ steps.scan.outputs.sarif }}
  findings-count:
    description: 'Total number of vulnerabilities found'
    value: ${{ steps.scan.outputs.findings-count }}
  critical-count:
    description: 'Number of CRITICAL severity findings'
    value: ${{ steps.scan.outputs.critical-count }}
  high-count:
    description: 'Number of HIGH severity findings'
    value: ${{ steps.scan.outputs.high-count }}
  policy-violations:
    description: 'Number of policy violations'
    value: ${{ steps.scan.outputs.policy-violations }}
  exit-code:
    description: 'Deputy exit code'
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: 'composite'
  steps:
    - name: Run Deputy Scan
      id: scan
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_REF: ${{ inputs.ref }}
        INPUT_ECOSYSTEMS: ${{ inputs.ecosystems }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_IGNORE_UNFIXED: ${{ inputs.ignore-unfixed }}
        INPUT_POLICY: ${{ inputs.policy }}
      run: |
        set -euo pipefail

        # Build command arguments as array (safer than string concatenation)
        ARGS=(scan)

        # Add target if not current directory
        if [ "$INPUT_TARGET" != "." ]; then
          ARGS+=("$INPUT_TARGET")
        fi

        # Add options
        ARGS+=(--ref "$INPUT_REF")
        ARGS+=(--format "$INPUT_FORMAT")
        ARGS+=(--output "$INPUT_OUTPUT")

        if [ "$INPUT_ECOSYSTEMS" != "all" ]; then
          ARGS+=(--ecosystems "$INPUT_ECOSYSTEMS")
        fi

        if [ "$INPUT_IGNORE_UNFIXED" = "true" ]; then
          ARGS+=(--ignore-unfixed)
        fi

        # Add policy files if specified
        if [ -n "$INPUT_POLICY" ]; then
          IFS=',' read -ra POLICIES <<< "$INPUT_POLICY"
          for policy in "${POLICIES[@]}"; do
            ARGS+=(--policy "$policy")
          done
        fi

        echo "Running: deputy ${ARGS[*]}"

        # Run scan and capture exit code
        set +e
        deputy "${ARGS[@]}" 2>&1
        EXIT_CODE=$?
        set -e

        echo "exit-code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
        echo "sarif=$INPUT_OUTPUT" >> "$GITHUB_OUTPUT"

        # Parse results for counts (SARIF format)
        # Uses security-severity from rule properties: CRITICAL >= 9.0, HIGH >= 7.0
        if [ -f "$INPUT_OUTPUT" ] && [ "$INPUT_FORMAT" = "sarif" ]; then
          FINDINGS=$(jq -r '.runs[0].results | length // 0' "$INPUT_OUTPUT" 2>/dev/null || echo "0")

          # Count by security-severity score (CRITICAL: 9.0+, HIGH: 7.0-8.9)
          # Build a map of ruleId -> security-severity, then count results by severity
          CRITICAL=$(jq -r '
            (.runs[0].tool.driver.rules // []) as $rules |
            [.runs[0].results[] |
              . as $r |
              ($rules | map(select(.id == $r.ruleId)) | .[0].properties."security-severity" // 0) as $sev |
              select($sev >= 9.0)
            ] | length
          ' "$INPUT_OUTPUT" 2>/dev/null || echo "0")

          HIGH=$(jq -r '
            (.runs[0].tool.driver.rules // []) as $rules |
            [.runs[0].results[] |
              . as $r |
              ($rules | map(select(.id == $r.ruleId)) | .[0].properties."security-severity" // 0) as $sev |
              select($sev >= 7.0 and $sev < 9.0)
            ] | length
          ' "$INPUT_OUTPUT" 2>/dev/null || echo "0")

          VIOLATIONS=$(jq -r '[.runs[0].results[] | select(.ruleId | startswith("policy/"))] | length // 0' "$INPUT_OUTPUT" 2>/dev/null || echo "0")

          echo "findings-count=$FINDINGS" >> "$GITHUB_OUTPUT"
          echo "critical-count=$CRITICAL" >> "$GITHUB_OUTPUT"
          echo "high-count=$HIGH" >> "$GITHUB_OUTPUT"
          echo "policy-violations=$VIOLATIONS" >> "$GITHUB_OUTPUT"

          echo "Found $FINDINGS vulnerabilities ($CRITICAL critical, $HIGH high), $VIOLATIONS policy violations"
        else
          echo "findings-count=0" >> "$GITHUB_OUTPUT"
          echo "critical-count=0" >> "$GITHUB_OUTPUT"
          echo "high-count=0" >> "$GITHUB_OUTPUT"
          echo "policy-violations=0" >> "$GITHUB_OUTPUT"
        fi

        # Store exit code for later check
        echo "DEPUTY_EXIT_CODE=$EXIT_CODE" >> "$GITHUB_ENV"

    - name: Upload SARIF to GitHub Security
      id: sarif-upload
      if: inputs.upload-sarif == 'true' && inputs.format == 'sarif' && always()
      uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
      with:
        sarif_file: ${{ inputs.output }}
        category: ${{ inputs.sarif-category }}
      continue-on-error: true

    - name: Fallback to PR comment when SARIF upload unavailable
      if: |
        inputs.upload-sarif == 'true' &&
        steps.sarif-upload.outcome == 'failure' &&
        github.event_name == 'pull_request' &&
        always()
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
      env:
        SARIF_PATH: ${{ inputs.output }}
        FINDINGS_COUNT: ${{ steps.scan.outputs.findings-count }}
        CRITICAL_COUNT: ${{ steps.scan.outputs.critical-count }}
        HIGH_COUNT: ${{ steps.scan.outputs.high-count }}
        VIOLATIONS_COUNT: ${{ steps.scan.outputs.policy-violations }}
      with:
        github-token: ${{ inputs.github-token }}
        retries: 3
        script: |
          const fs = require('fs');

          // Hidden marker for finding/updating this specific comment
          const COMMENT_MARKER = '<!-- deputy-security-scan -->';
          const Q = '>'; // Blockquote char (avoids YAML parsing issues)
          const MAX_COMMENT_LENGTH = 65536; // GitHub comment size limit

          // Get PR number - context.issue.number works for PR events in github-script
          const prNumber = context.issue?.number || context.payload?.pull_request?.number;
          if (!prNumber) {
            console.log('Could not determine PR number, skipping comment');
            return;
          }

          // Read counts from env vars (safer than inline expression substitution)
          const findings = parseInt(process.env.FINDINGS_COUNT) || 0;
          const critical = parseInt(process.env.CRITICAL_COUNT) || 0;
          const high = parseInt(process.env.HIGH_COUNT) || 0;
          const violations = parseInt(process.env.VIOLATIONS_COUNT) || 0;
          const hasIssues = findings > 0 || violations > 0;

          // Find existing Deputy comment (paginate to handle PRs with many comments)
          let existingComment = null;
          try {
            for await (const response of github.paginate.iterator(
              github.rest.issues.listComments,
              { owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, per_page: 100 }
            )) {
              existingComment = response.data.find(c => c.body?.includes(COMMENT_MARKER));
              if (existingComment) break;
            }
          } catch (e) {
            console.log('Could not fetch comments:', e.message);
            // Continue - we'll create a new comment if needed
          }

          // Determine previous state (handle corrupted/empty body)
          const commentBody = existingComment?.body || '';
          const wasResolved = commentBody.includes('[!TIP]');
          const hadIssues = existingComment && !wasResolved;

          // Decision matrix:
          // - No issues, no prior comment -> do nothing
          // - No issues, had issues -> update to resolved
          // - No issues, was resolved -> do nothing (already resolved)
          // - Has issues -> create or update with findings

          if (!hasIssues && !existingComment) {
            console.log('No findings, no prior comment - nothing to do');
            return;
          }

          if (!hasIssues && wasResolved) {
            console.log('Already marked as resolved - nothing to do');
            return;
          }

          const timestamp = new Date().toISOString().replace('T', ' ').slice(0, 16) + ' UTC';
          const footer = `<sub>Deputy · ${timestamp}</sub>`;

          // Helper to create or update comment with retry on conflict
          async function upsertComment(body) {
            // Truncate if too long
            if (body.length > MAX_COMMENT_LENGTH) {
              const truncateMsg = '\n\n_... truncated due to size limits_\n\n' + footer;
              body = body.slice(0, MAX_COMMENT_LENGTH - truncateMsg.length) + truncateMsg;
            }

            if (existingComment) {
              try {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body: body
                });
                console.log('Updated existing comment');
                return;
              } catch (e) {
                // Comment may have been deleted - fall through to create
                if (e.status === 404) {
                  console.log('Previous comment was deleted, creating new one');
                  existingComment = null;
                } else {
                  throw e;
                }
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body
            });
            console.log('Created new comment');
          }

          let body;

          if (!hasIssues && hadIssues) {
            // Transition: issues -> resolved
            body = [
              COMMENT_MARKER,
              `${Q} [!TIP]`,
              `${Q} **All Issues Resolved**`,
              Q,
              `${Q} Previously reported security issues have been addressed.`,
              '',
              footer
            ].join('\n');

            await upsertComment(body);
            return;
          }

          // Has issues - build the findings comment
          let alertType = 'WARNING';
          let title = 'Security Issues Found';
          if (critical > 0 || violations > 0) {
            alertType = 'CAUTION';
            title = 'Critical Security Issues';
          }

          // Try to read SARIF for detailed findings
          let details = [];
          const sarifPath = process.env.SARIF_PATH || '';
          try {
            if (sarifPath && fs.existsSync(sarifPath)) {
              const sarif = JSON.parse(fs.readFileSync(sarifPath, 'utf8'));
              const results = sarif.runs?.[0]?.results || [];
              const rules = sarif.runs?.[0]?.tool?.driver?.rules || [];

              if (results.length > 0) {
                // Group by severity
                const bySeverity = { critical: [], high: [], medium: [], low: [] };

                for (const result of results) {
                  const rule = rules.find(r => r.id === result.ruleId);
                  const sev = rule?.properties?.['security-severity'] || 0;
                  const id = result.ruleId;

                  if (sev >= 9.0) bySeverity.critical.push(id);
                  else if (sev >= 7.0) bySeverity.high.push(id);
                  else if (sev >= 4.0) bySeverity.medium.push(id);
                  else bySeverity.low.push(id);
                }

                // Build collapsible details (limit to avoid huge comments)
                const sections = [];
                for (const [level, ids] of Object.entries(bySeverity)) {
                  const unique = [...new Set(ids)];
                  if (unique.length > 0) {
                    const maxShow = 10;
                    const items = unique.slice(0, maxShow).map(id => '`' + id + '`').join(', ');
                    const more = unique.length > maxShow ? ` +${unique.length - maxShow} more` : '';
                    sections.push(`**${level.charAt(0).toUpperCase() + level.slice(1)}:** ${items}${more}`);
                  }
                }

                if (sections.length > 0) {
                  details = [
                    '',
                    '<details>',
                    '<summary>Findings by severity</summary>',
                    '',
                    ...sections,
                    '',
                    '</details>'
                  ];
                }
              }
            }
          } catch (e) {
            console.log('Could not parse SARIF for details:', e.message);
          }

          body = [
            COMMENT_MARKER,
            `${Q} [!${alertType}]`,
            `${Q} **${title}**`,
            Q,
            `${Q} | Vulnerabilities | Critical | High | Policy Violations |`,
            `${Q} |:---------------:|:--------:|:----:|:-----------------:|`,
            `${Q} | ${findings} | ${critical} | ${high} | ${violations} |`,
            ...details,
            '',
            footer
          ].join('\n');

          await upsertComment(body);
      continue-on-error: true

    - name: Check failure conditions
      shell: bash
      env:
        INPUT_FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        INPUT_FAIL_ON_POLICY_VIOLATION: ${{ inputs.fail-on-policy-violation }}
        FINDINGS: ${{ steps.scan.outputs.findings-count }}
        VIOLATIONS: ${{ steps.scan.outputs.policy-violations }}
      run: |
        EXIT_CODE="${DEPUTY_EXIT_CODE:-0}"

        # Check for vulnerability findings (use default 0 for empty values)
        if [ "$INPUT_FAIL_ON_FINDINGS" = "true" ] && [ "${FINDINGS:-0}" -gt 0 ]; then
          echo "::error::Found $FINDINGS vulnerabilities"
          exit 1
        fi

        # Check for policy violations (use default 0 for empty values)
        if [ "$INPUT_FAIL_ON_POLICY_VIOLATION" = "true" ] && [ "${VIOLATIONS:-0}" -gt 0 ]; then
          echo "::error::Found $VIOLATIONS policy violations"
          exit 1
        fi

        # Check deputy exit code for policy deny actions
        if [ "$INPUT_FAIL_ON_POLICY_VIOLATION" = "true" ] && [ "$EXIT_CODE" != "0" ]; then
          echo "::error::Deputy scan failed with exit code $EXIT_CODE (policy violation)"
          exit 1
        fi

        echo "Scan completed successfully"

    - name: Write job summary
      if: always()
      shell: bash
      env:
        FINDINGS: ${{ steps.scan.outputs.findings-count }}
        CRITICAL: ${{ steps.scan.outputs.critical-count }}
        HIGH: ${{ steps.scan.outputs.high-count }}
        VIOLATIONS: ${{ steps.scan.outputs.policy-violations }}
        SARIF_PATH: ${{ inputs.output }}
        FORMAT: ${{ inputs.format }}
        TARGET: ${{ inputs.target }}
        # Cap detailed rows so the summary stays within GitHub's size limit.
        MAX_ROWS: '60'
      run: |
        FINDINGS="${FINDINGS:-0}"
        CRITICAL="${CRITICAL:-0}"
        HIGH="${HIGH:-0}"
        VIOLATIONS="${VIOLATIONS:-0}"

        {
          echo "## Deputy Security Scan"
          echo ""
          echo "Target: \`${TARGET}\`"
          echo ""

          # One-line status banner using GitHub's alert syntax.
          if [ "$VIOLATIONS" -gt 0 ] || [ "$CRITICAL" -gt 0 ]; then
            echo "> [!CAUTION]"
            echo "> ${CRITICAL} critical finding(s) and ${VIOLATIONS} policy violation(s) need immediate attention."
          elif [ "$HIGH" -gt 0 ]; then
            echo "> [!WARNING]"
            echo "> ${HIGH} high-severity finding(s) need attention."
          elif [ "$FINDINGS" -gt 0 ]; then
            echo "> [!NOTE]"
            echo "> ${FINDINGS} finding(s) detected; none critical or high severity."
          else
            echo "> [!TIP]"
            echo "> No vulnerabilities found."
          fi
          echo ""

          echo "| Total | Critical | High | Policy Violations |"
          echo "|------:|---------:|-----:|------------------:|"
          echo "| ${FINDINGS} | ${CRITICAL} | ${HIGH} | ${VIOLATIONS} |"
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"

        # Detailed, per-finding breakdown is only available from SARIF output.
        if [ "$FINDINGS" -gt 0 ] && [ "$FORMAT" = "sarif" ] && [ -f "$SARIF_PATH" ] && command -v jq >/dev/null 2>&1; then
          # Emit one markdown table row per finding, sorted by severity, using
          # security-severity (CVSS) and fixedVersions from the rule metadata.
          ROWS=$(jq -r --argjson max "${MAX_ROWS:-60}" '
            (.runs[0].tool.driver.rules // []) as $rules
            | ($rules | map({key: .id, value: .properties}) | from_entries) as $rp
            | def slabel($s): if $s >= 9 then "Critical" elif $s >= 7 then "High" elif $s >= 4 then "Medium" elif $s > 0 then "Low" else "Unscored" end;
              def srank($s):  if $s >= 9 then 0      elif $s >= 7 then 1    elif $s >= 4 then 2       elif $s > 0 then 3   else 4 end;
            [ .runs[0].results[]
              | . as $r
              | ($rp[$r.ruleId] // {}) as $p
              | (($p["security-severity"] // "0") | tonumber? // 0) as $sev
              | { rank: srank($sev),
                  label: slabel($sev),
                  pkg: ($r.properties.package // $r.ruleId),
                  ver: (($r.properties.version // "") | sub("^v"; "")),
                  adv: ($r.properties.cve // $r.ruleId),
                  fix: (($p.fixedVersions // []) | map(tostring) | if length > 0 then join(", ") else "—" end),
                  scope: (if ($r.properties.isDirect // false) then "direct" else "indirect" end) }
            ]
            | unique_by([.pkg, .adv])
            | sort_by(.rank, .pkg)
            | .[:$max]
            | .[]
            | "| " + .label + " | `" + .pkg + "` | " + .ver + " | " + .scope + " | " + .adv + " | " + .fix + " |"
          ' "$SARIF_PATH" 2>/dev/null || true)

          if [ -n "$ROWS" ]; then
            {
              echo "### Findings"
              echo ""
              echo "| Severity | Package | Version | Scope | Advisory | Fixed in |"
              echo "|----------|---------|---------|-------|----------|----------|"
              echo "$ROWS"
              echo ""
              if [ "$FINDINGS" -gt "${MAX_ROWS:-60}" ]; then
                echo "_Showing first ${MAX_ROWS:-60} of ${FINDINGS} findings. Download the SARIF artifact or run \`deputy scan\` for the full report._"
              else
                echo "_Run \`deputy scan\` locally or download the SARIF artifact for full details and remediation commands._"
              fi
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        fi
