# OIDC Identity Federation Policies for Deputy Server
#
# These policies demonstrate how to secure Deputy server deployments using
# OIDC workload identity federation from various identity providers.
#
# OIDC federation allows CI/CD systems and cloud workloads to authenticate
# without managing secrets - they get short-lived tokens from their platform's
# identity provider that Deputy validates against the provider's JWKS endpoint.
#
# Common OIDC issuers:
#   - GitHub Actions: https://token.actions.githubusercontent.com
#   - GitLab CI/CD: https://gitlab.com (or self-hosted)
#   - Google Cloud: https://accounts.google.com
#   - AWS STS: https://sts.amazonaws.com (with web identity)
#   - Azure AD: https://login.microsoftonline.com/{tenant}/v2.0
#   - Kubernetes: https://kubernetes.default.svc.cluster.local
#
# A subject prefix is a claim, not a proof of origin, so every rule below pairs a
# subject shape with the issuer allowed to mint it. Without that, any accepted
# issuer that can carry custom claims can present sub=system:serviceaccount:...
# and be treated as a Kubernetes workload. Replace these issuer URLs with your
# own: a cluster issuer is deployment-specific, and "sa:" here stands for
# Deputy's own service account issuer.
#
# JWT claims vary by provider. See examples below for provider-specific patterns.
#
# Two kinds of rule appear below, and the difference decides which entrypoints
# each one declares. A rule that decides whether a caller is trusted at all
# covers every service entrypoint, because an identity that may not scan may not
# diff or build a dependency graph either. A rule scoped to one operation, such
# as restricting secrets scanning to approved repositories, names only that
# operation's entrypoint. Adding a service entrypoint means revisiting the first
# kind; internal/policy enforces that with a test over EntrypointsService.

policies:
  # =============================================================================
  # GitHub Actions OIDC
  # =============================================================================
  # GitHub Actions can request OIDC tokens with rich claims about the workflow.
  # See: https://docs.github.com/en/actions/deployment/security-hardening-your-deployments
  #
  # Key claims in GitHub Actions OIDC tokens:
  #   - sub: repo:<owner>/<repo>:ref:refs/heads/<branch>
  #   - repository: <owner>/<repo>
  #   - repository_owner: <owner>
  #   - repository_owner_id: <numeric_id>
  #   - workflow: <workflow_filename>
  #   - ref: refs/heads/<branch> or refs/tags/<tag>
  #   - actor: GitHub username that triggered the workflow
  #   - event_name: push, pull_request, workflow_dispatch, etc.
  #   - job_workflow_ref: <owner>/<repo>/.github/workflows/<file>@<ref>
  #   - runner_environment: github-hosted or self-hosted

  - name: github-actions-organization-allowlist
    description: Only allow workflows from trusted GitHub organizations
    entrypoints:
      - service_scan_request
      - service_list_request
      - service_sbom_request
      - service_secrets_request
      - service_diff_request
      - service_graph_request
    rules:
      - action: deny
        when: |
          jwt.?iss.orValue("") == "https://token.actions.githubusercontent.com" &&
          !jwt.?repository_owner.orValue("").matches("^(acme-corp|acme-infra|acme-security)$")
        reason: "Only workflows from trusted organizations are allowed"
        remediation: "Contact security team to add your organization to the allowlist"

  - name: github-actions-repository-allowlist
    description: Restrict to specific repositories for security-sensitive operations
    entrypoints:
      - service_secrets_request
    rules:
      - action: deny
        when: |
          jwt.?iss.orValue("") == "https://token.actions.githubusercontent.com" &&
          !(jwt.?repository.orValue("") in [
            "acme-corp/security-scanner",
            "acme-corp/compliance-checks",
            "acme-infra/container-hardening"
          ])
        reason: "Secrets scanning restricted to approved repositories"
        remediation: "Request repository access in #security-requests"

  - name: github-actions-protected-branch
    description: Only allow production scans from protected branches
    entrypoints:
      - service_scan_request
    rules:
      - action: warn
        when: |
          jwt.?iss.orValue("") == "https://token.actions.githubusercontent.com" &&
          !jwt.?ref.orValue("").matches("^refs/(heads/main|tags/v[0-9]+)")
        reason: "Production scans should run from main branch or release tags"
        remediation: "Merge to main or create a release tag for production scans"

  - name: github-actions-no-pull-request-secrets
    description: Block secrets scanning on pull requests (may leak to forks)
    entrypoints:
      - service_secrets_request
    rules:
      - action: deny
        when: |
          jwt.?iss.orValue("") == "https://token.actions.githubusercontent.com" &&
          jwt.?event_name.orValue("") == "pull_request"
        reason: "Secrets scanning not allowed on pull requests"
        remediation: "Use workflow_dispatch or push events for secrets scanning"

  - name: github-actions-require-reusable-workflow
    description: Require scans to use the official reusable workflow
    entrypoints:
      - service_scan_request
    rules:
      - action: warn
        when: |
          jwt.?iss.orValue("") == "https://token.actions.githubusercontent.com" &&
          !jwt.?job_workflow_ref.orValue("").startsWith("acme-corp/workflows/.github/workflows/security-scan.yml@")
        reason: "Consider using the official reusable workflow for consistent scanning"
        remediation: "See https://github.com/acme-corp/workflows/blob/main/.github/workflows/security-scan.yml"

  # =============================================================================
  # GitLab CI/CD OIDC
  # =============================================================================
  # GitLab provides OIDC tokens for CI/CD jobs.
  # See: https://docs.gitlab.com/ee/ci/secrets/id_token_authentication.html
  #
  # Key claims in GitLab CI OIDC tokens:
  #   - sub: project_path:<namespace>/<project>:ref_type:<type>:ref:<ref>
  #   - namespace_path: <namespace>
  #   - project_path: <namespace>/<project>
  #   - ref: <branch_or_tag>
  #   - ref_type: branch or tag
  #   - pipeline_source: push, web, api, schedule, etc.
  #   - user_login: GitLab username
  #   - user_email: User email
  #   - environment: Deployment environment name

  - name: gitlab-namespace-restriction
    description: Only allow GitLab projects from trusted namespaces
    entrypoints:
      - service_scan_request
      - service_list_request
      - service_sbom_request
      - service_diff_request
      - service_graph_request
      - service_secrets_request
    rules:
      - action: deny
        when: |
          jwt.?iss.orValue("") == "https://gitlab.com" &&
          !jwt.?namespace_path.orValue("").matches("^(acme|acme-security|acme-platform)(/.*)?$")
        reason: "Only projects from trusted GitLab namespaces allowed"

  - name: gitlab-protected-environment
    description: Restrict production operations to protected environments
    entrypoints:
      - service_secrets_request
    rules:
      - action: deny
        when: |
          jwt.?iss.orValue("") == "https://gitlab.com" &&
          jwt.?environment.orValue("") != "" &&
          !(jwt.?environment.orValue("") in ["production", "staging"])
        reason: "Secrets scanning requires protected environment"

  # =============================================================================
  # Google Cloud Workload Identity
  # =============================================================================
  # GCP service accounts can federate with external OIDC providers.
  # See: https://cloud.google.com/iam/docs/workload-identity-federation
  #
  # Key claims for GCP service account tokens:
  #   - sub: <service_account_unique_id>
  #   - email: <sa-name>@<project>.iam.gserviceaccount.com
  #   - aud: Usually the target service URL
  #   - azp: Authorized party (for user tokens)

  - name: gcp-service-account-allowlist
    description: Only allow specific GCP service accounts
    entrypoints:
      - service_scan_request
      - service_list_request
      - service_sbom_request
      - service_secrets_request
      - service_diff_request
      - service_graph_request
    rules:
      - action: deny
        when: |
          jwt.?iss.orValue("") == "https://accounts.google.com" &&
          jwt.?email.orValue("").endsWith(".iam.gserviceaccount.com") &&
          !(jwt.?email.orValue("") in [
            "deputy-scanner@acme-prod.iam.gserviceaccount.com",
            "deputy-scanner@acme-staging.iam.gserviceaccount.com",
            "ci-pipeline@acme-ci.iam.gserviceaccount.com"
          ])
        reason: "Service account not in allowlist"

  - name: gcp-project-restriction
    description: Restrict to service accounts from specific GCP projects
    entrypoints:
      - service_scan_request
      - service_list_request
      - service_diff_request
      - service_graph_request
      - service_sbom_request
      - service_secrets_request
    rules:
      - action: deny
        when: |
          jwt.?iss.orValue("") == "https://accounts.google.com" &&
          jwt.?email.orValue("").endsWith(".iam.gserviceaccount.com") &&
          !jwt.?email.orValue("").matches("@(acme-prod|acme-staging|acme-ci)\\.iam\\.gserviceaccount\\.com$")
        reason: "Service account must be from approved GCP project"

  # =============================================================================
  # AWS IAM / STS Web Identity
  # =============================================================================
  # AWS supports OIDC federation through IAM roles and STS AssumeRoleWithWebIdentity.
  # See: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_oidc.html
  #
  # AWS doesn't have a single OIDC issuer - tokens come from the external IdP.
  # The AWS account/role context is in the assumed role ARN.

  - name: aws-account-restriction
    description: |
      Restrict based on the AWS account ID in assumed role claims.

      AWS does not mint the token Deputy sees. A workload exchanges a token from
      its own identity provider for AWS credentials, so the assumed-role ARN
      arrives as a claim on that provider's token. The issuer named here is
      therefore the identity provider, not AWS, and a deployment must set it to
      whichever provider it trusts to assert an ARN.

      Naming it is the whole point. Without an issuer, any other accepted issuer
      able to set custom claims could present
      amr: ["arn:aws:sts::123456789012:assumed-role/anything"], and this rule
      would read the approved account number and admit it.
    entrypoints:
      - service_scan_request
      - service_list_request
      - service_diff_request
      - service_graph_request
      - service_sbom_request
      - service_secrets_request
    rules:
      - action: deny
        when: |
          jwt.?iss.orValue("") == "https://acme.okta.com" &&
          has(jwt.amr) &&
          jwt.?amr.orValue([]).exists(a, a.startsWith("arn:aws:sts::")) &&
          !jwt.?amr.orValue([]).exists(a,
            a.matches("^arn:aws:sts::(123456789012|234567890123):assumed-role/"))
        reason: "AWS role must be from approved accounts"
        remediation: "Request access for your AWS account ID"

  # =============================================================================
  # Azure AD / Entra ID
  # =============================================================================
  # Azure AD provides OIDC tokens for both users and managed identities.
  # See: https://learn.microsoft.com/en-us/azure/active-directory/develop/v2-protocols-oidc
  #
  # Key claims in Azure AD tokens:
  #   - tid: Tenant ID
  #   - oid: Object ID (unique user/app ID)
  #   - sub: Subject (user-specific)
  #   - appid: Application (client) ID (for app tokens)
  #   - roles: App roles assigned
  #   - groups: Group memberships (if configured)

  - name: azure-tenant-restriction
    description: Only allow tokens from specific Azure AD tenants
    entrypoints:
      - service_scan_request
      - service_list_request
      - service_sbom_request
      - service_diff_request
      - service_graph_request
      - service_secrets_request
    rules:
      - action: deny
        when: |
          jwt.?iss.orValue("").startsWith("https://login.microsoftonline.com/") &&
          !(jwt.?tid.orValue("") in [
            "12345678-1234-1234-1234-123456789abc",
            "87654321-4321-4321-4321-cba987654321"
          ])
        reason: "Token must be from approved Azure AD tenant"

  - name: azure-managed-identity
    description: Restrict to specific Azure managed identities
    entrypoints:
      - service_secrets_request
    rules:
      - action: deny
        when: |
          jwt.?iss.orValue("").startsWith("https://login.microsoftonline.com/") &&
          jwt.?idtyp.orValue("") == "app" &&
          !(jwt.?oid.orValue("") in [
            "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
          ])
        reason: "Managed identity not authorized for secrets scanning"

  # =============================================================================
  # Kubernetes Service Account Tokens
  # =============================================================================
  # Kubernetes 1.21+ issues projected service account tokens with OIDC structure.
  # See: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
  #
  # Key claims in Kubernetes service account tokens:
  #   - sub: system:serviceaccount:<namespace>:<name>
  #   - kubernetes.io/serviceaccount/namespace: <namespace>
  #   - kubernetes.io/serviceaccount/name: <name>
  #   - kubernetes.io/pod/name: <pod_name>
  #   - kubernetes.io/pod/uid: <pod_uid>

  - name: kubernetes-namespace-restriction
    description: Only allow workloads from specific Kubernetes namespaces
    entrypoints:
      - service_scan_request
      - service_list_request
      - service_sbom_request
      - service_diff_request
      - service_graph_request
      - service_secrets_request
    rules:
      - action: deny
        when: |
          jwt.?iss.orValue("") == "https://kubernetes.default.svc.cluster.local" &&
          jwt.?sub.orValue("").startsWith("system:serviceaccount:") &&
          !("kubernetes.io/serviceaccount/namespace" in jwt &&
            jwt["kubernetes.io/serviceaccount/namespace"] in ["security", "ci-cd", "production"])
        reason: "Kubernetes workload must be in approved namespace"

  - name: kubernetes-service-account-allowlist
    description: Restrict to specific Kubernetes service accounts
    entrypoints:
      - service_secrets_request
    rules:
      - action: deny
        when: |
          jwt.?iss.orValue("") == "https://kubernetes.default.svc.cluster.local" &&
          jwt.?sub.orValue("").startsWith("system:serviceaccount:") &&
          !jwt.?sub.orValue("").matches("^system:serviceaccount:(security|ci-cd):(deputy-scanner|security-bot)$")
        reason: "Service account not authorized for secrets scanning"

  # =============================================================================
  # Deputy Service Accounts
  # =============================================================================
  # Deputy issues tokens to machine callers that belong to no external provider.
  # The subject names the account, "sa:<name>", and the scopes claim says what
  # the account may do.

  - name: deputy-service-account-scopes
    description: |
      Hold a Deputy service account to the scopes it was issued.

      Recognizing the "sa:" subject shape is not authorization. It says who is
      calling, not what they may do, and unified-identity-authorization below
      trusts that shape at every service entrypoint, so without this rule a
      scope-limited account reached every operation in the file. An earlier
      version pointed at a service-account-scopes policy for the scope test, but
      that policy lives in service-multi-tenant.yaml and Deputy does not compose
      the files an operator did not load. An example has to be safe as loaded.

      The required scope is looked up by entrypoint. An entrypoint absent from
      the lookup resolves to "", which no scope equals, so a service entrypoint
      added later refuses service accounts until someone names its scope.
      Refusing is the safe direction for a lookup that has fallen behind. Both
      hand-written lists here, the entrypoints this policy declares and the scope
      for each, are checked by a test in internal/policy that runs a scoped and
      an unscoped account against every entrypoint in EntrypointsService.

      Which accounts exist is the issuer's decision, so this rule does not name
      them. It decides only whether the account presenting the token carries the
      scope this operation needs.
    entrypoints:
      - service_scan_request
      - service_list_request
      - service_sbom_request
      - service_diff_request
      - service_graph_request
      - service_secrets_request
    rules:
      - action: deny
        when: |
          jwt.?iss.orValue("") == "https://deputy.acme-corp.internal" &&
          jwt.?sub.orValue("").startsWith("sa:") &&
          !jwt.?scopes.orValue([]).exists(s, s == {
            "service_scan_request": "scan",
            "service_list_request": "list",
            "service_sbom_request": "sbom",
            "service_diff_request": "diff",
            "service_graph_request": "graph",
            "service_secrets_request": "secrets"
          }[?env.entrypoint].orValue(""))
        reason: "Service account lacks the scope this operation requires"
        remediation: "Issue the account the scope for this operation: scan, list, sbom, diff, graph, or secrets"

  # =============================================================================
  # Human Identity Policies (Okta, Auth0, etc.)
  # =============================================================================
  # Human users typically authenticate through identity providers like Okta, Auth0,
  # or corporate Azure AD with user tokens (not service principals).
  #
  # These tokens contain user-specific claims like email, groups, roles.

  - name: human-require-mfa
    description: |
      Require MFA for human users accessing sensitive operations.

      "Human" means an identity that is not recognizably a machine, so the test
      enumerates the machine shapes this file documents. It has to enumerate
      them: a machine identity carries no MFA factor and never will, so treating
      an unrecognized subject as human denies a CI job rather than challenging a
      person. The earlier version recognized only Deputy service accounts,
      Kubernetes workloads, and GitHub Actions, which left GitLab, Google, AWS,
      and Azure machine identities denied unconditionally at this entrypoint.

      Each branch recognizes a provider and pairs the shape with its issuer where
      the shape alone is a name any issuer could mint, which is the same reason
      the GCP branch of unified-identity-authorization checks the issuer. Which
      accounts and namespaces are acceptable stays with the per-provider rules;
      this only decides whether a caller is a machine.

      That provider recognition is now written twice in this file, here and in
      unified-identity-authorization, because a policy cannot share a definition
      with another policy. Both copies drifting is a real risk.
    entrypoints:
      - service_secrets_request
    rules:
      - action: deny
        when: |
          !jwt.anonymous &&
          !(
            // Deputy service account, Kubernetes workload, or GitHub Actions.
            (jwt.?iss.orValue("") == "https://kubernetes.default.svc.cluster.local" &&
             jwt.?sub.orValue("").startsWith("system:")) ||
            (jwt.?iss.orValue("") == "https://deputy.acme-corp.internal" &&
             jwt.?sub.orValue("").startsWith("sa:")) ||
            (jwt.?iss.orValue("") == "https://token.actions.githubusercontent.com" &&
             jwt.?sub.orValue("").startsWith("repo:")) ||
            // GitLab CI job.
            (jwt.?iss.orValue("") == "https://gitlab.com" &&
             jwt.?sub.orValue("").startsWith("project_path:")) ||
            // AWS role assumed through web identity.
            (jwt.?iss.orValue("") == "https://acme.okta.com" &&
             jwt.?amr.orValue([]).exists(a, a.startsWith("arn:aws:sts::"))) ||
            // Google service account.
            (jwt.?iss.orValue("") == "https://accounts.google.com" &&
             jwt.?email.orValue("").endsWith(".iam.gserviceaccount.com")) ||
            // Azure application identity rather than a user.
            (jwt.?iss.orValue("").startsWith("https://login.microsoftonline.com/") &&
             jwt.?idtyp.orValue("") == "app")
          ) &&
          !((jwt.?iss.orValue("") == "https://acme.okta.com" ||
             jwt.?iss.orValue("").startsWith("https://login.microsoftonline.com/")) &&
            jwt.?amr.orValue([]).exists(a, a in ["mfa", "otp", "hwk", "swk"]))
        reason: "Multi-factor authentication required for secrets scanning"
        remediation: "Re-authenticate with MFA enabled"

  - name: human-group-restriction
    description: |
      Require security group membership for sensitive operations.

      The machine exemption is the same one human-require-mfa applies, and for
      the same reason: an email claim does not mean a person. A Google service
      account presents deputy-scanner@acme-prod.iam.gserviceaccount.com, so
      keying on the presence of an email denied every service account here.

      This is the fourth copy of provider recognition in this file, because a
      policy cannot share a definition with another policy.
    entrypoints:
      - service_secrets_request
    rules:
      - action: deny
        when: |
          !jwt.anonymous &&
          jwt.?email.orValue("") != "" &&
          !(
            (jwt.?iss.orValue("") == "https://kubernetes.default.svc.cluster.local" &&
             jwt.?sub.orValue("").startsWith("system:")) ||
            (jwt.?iss.orValue("") == "https://deputy.acme-corp.internal" &&
             jwt.?sub.orValue("").startsWith("sa:")) ||
            (jwt.?iss.orValue("") == "https://token.actions.githubusercontent.com" &&
             jwt.?sub.orValue("").startsWith("repo:")) ||
            (jwt.?iss.orValue("") == "https://gitlab.com" &&
             jwt.?sub.orValue("").startsWith("project_path:")) ||
            (jwt.?iss.orValue("") == "https://acme.okta.com" &&
             jwt.?amr.orValue([]).exists(a, a.startsWith("arn:aws:sts::"))) ||
            (jwt.?iss.orValue("") == "https://accounts.google.com" &&
             jwt.?email.orValue("").endsWith(".iam.gserviceaccount.com")) ||
            (jwt.?iss.orValue("").startsWith("https://login.microsoftonline.com/") &&
             jwt.?idtyp.orValue("") == "app")
          ) &&
          !((jwt.?iss.orValue("") == "https://acme.okta.com" ||
             jwt.?iss.orValue("").startsWith("https://login.microsoftonline.com/")) &&
            jwt.?groups.orValue([]).exists(g, g in ["security-team", "sre-oncall", "platform-admins"]))
        reason: "Security group membership required"
        remediation: "Request access in #security-access channel"

  # =============================================================================
  # Combined Human + Machine Policy
  # =============================================================================
  # Unified authorization that works for both identity types

  - name: unified-identity-authorization
    description: |
      Deny any authenticated identity that is not one of the shapes this
      deployment trusts, for both human and machine callers.

      This is one deny whose condition negates every trusted shape, rather than
      a list of allow rules followed by a catch-all deny, because that shape
      cannot express what it looks like it expresses. Rules do not short circuit
      and a deny is final regardless of any allow, so a catch-all "deny unless
      anonymous" fires for the trusted identities too and the policy denies
      everyone. Writing the trusted set once and negating it keeps the two in
      agreement, at the cost of one long expression. Whether an allow should be
      able to lift a deny is a separate question.

      Each branch recognizes a provider, and deliberately does not repeat which
      organizations, namespaces, projects, accounts, or tenants that provider is
      allowed to present. Those live in the per-provider rules above, and every
      one of them denies at every service entrypoint, so the two compose: this
      rule refuses an identity that matches no provider at all, and each gate
      refuses the callers its own provider should not admit. Restating an
      allowlist here would create a second copy to drift, which it did: an
      earlier version trusted two organizations while the allowlist accepted
      three, so the third was admitted by one rule and denied by the other.

      The human branch is the exception and it needs a rule of its own, because
      no other policy here gates general human access by group. It carries the
      union of every group this file names anywhere. A broad gate has to admit
      everyone a narrow gate admits, or the narrow gate is unreachable: when this
      list held three groups and the secrets rule accepted sre-oncall, an
      sre-oncall human was accepted for secrets and refused entry, so they could
      not reach it at all.
    entrypoints:
      - service_scan_request
      - service_list_request
      - service_sbom_request
      - service_diff_request
      - service_graph_request
      - service_secrets_request
    rules:
      - action: deny
        when: |
          !jwt.anonymous &&
          !(
            // A GitHub Actions workflow. Which organizations are acceptable is
            // github-actions-organization-allowlist's decision, not this rule's.
            jwt.?iss.orValue("") == "https://token.actions.githubusercontent.com" ||
            // A GitLab CI job; gitlab-namespace-restriction picks the namespaces.
            jwt.?iss.orValue("") == "https://gitlab.com" ||
            // A Google service account; the two gcp- rules pick the accounts and
            // projects. The issuer is part of the shape, because the email claim
            // alone is a name any issuer can mint.
            (jwt.?iss.orValue("") == "https://accounts.google.com" &&
             jwt.?email.orValue("").endsWith(".iam.gserviceaccount.com")) ||
            // An assumed AWS role; aws-account-restriction picks the accounts.
            (jwt.?iss.orValue("") == "https://acme.okta.com" &&
             jwt.?amr.orValue([]).exists(a, a.startsWith("arn:aws:sts::"))) ||
            // An Azure AD identity; azure-tenant-restriction picks the tenants.
            jwt.?iss.orValue("").startsWith("https://login.microsoftonline.com/") ||
            // A Kubernetes workload; kubernetes-namespace-restriction picks the
            // namespaces. The issuer is part of the shape: any issuer that can
            // carry custom claims could otherwise mint this subject.
            (jwt.?iss.orValue("") == "https://kubernetes.default.svc.cluster.local" &&
             jwt.?sub.orValue("").startsWith("system:serviceaccount:")) ||
            // A Deputy-issued service account; deputy-service-account-scopes,
            // in this file, decides what it may do. The human-only rules already
            // recognize this shape, and omitting it here denied it everywhere.
            (jwt.?iss.orValue("") == "https://deputy.acme-corp.internal" &&
             jwt.?sub.orValue("").startsWith("sa:")) ||
            // A human from the corporate identity provider, with an authorized
            // group membership. The issuer is as load-bearing here as in every
            // machine branch: a group claim only means something when it comes
            // from the directory that assigns groups.
            (jwt.?iss.orValue("") == "https://acme.okta.com" &&
             jwt.?email.orValue("") != "" &&
             jwt.?groups.orValue([]).exists(g, g in [
               "developers", "security-team", "platform",
               "sre-oncall", "platform-admins"
             ]))
          )
        reason: "Identity not authorized"
        remediation: "Contact security team for access"

  # =============================================================================
  # Audit Logging Policies
  # =============================================================================

  - name: audit-privileged-machine-identity
    description: Log when privileged machine identities access the system
    entrypoints:
      - service_scan_request
      - service_sbom_request
      - service_secrets_request
    rules:
      - action: warn
        when: |
          jwt.?iss.orValue("") == "https://token.actions.githubusercontent.com" &&
          jwt.?repository.orValue("").contains("security")
        reason: "Security repository workflow accessing Deputy - audit log entry"

      - action: warn
        when: |
          jwt.?email.orValue("").endsWith(".iam.gserviceaccount.com") &&
          jwt.?email.orValue("").contains("admin")
        reason: "Admin service account accessing Deputy - audit log entry"
