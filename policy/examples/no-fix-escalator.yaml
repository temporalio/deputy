# Structure:
#   vulnerability.package.direct               - Whether this is a direct dependency
#   vulnerability.advisory.fixed_versions      - Versions containing the fix
#   vulnerability.advisory.severity.level      - Severity enum
#
# Severity constants: severity.critical, severity.high, severity.medium, severity.low
#
policies:
  - name: no-fix-escalator
    description: Escalate direct vulnerabilities with no available fix
    vars:
      hasFix: 'size(vulnerability.advisory.fixed_versions) > 0'
      isDirect: 'vulnerability.package.direct'
      highSev: 'vulnerability.advisory.severity.level in [severity.critical, severity.high]'
    rules:
      - action: warn
        when: env.entrypoint in ["scan_vulnerability","diff_vulnerability"] && isDirect && !hasFix && highSev
        reason: Direct dependency has a CRITICAL/HIGH vuln with no available fix
        remediation: Apply vendor mitigation or isolate usage until a fix is released
