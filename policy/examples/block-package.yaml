apiVersion: policy.deputy.sh/v1alpha2
kind: PolicyBundle
metadata:
  title: "Known-bad package blocklist"
policies:
  - name: block-known-bad-packages
    description: Deny npm/PyPI artifacts that have been pulled from public registries for supply-chain incidents
    vars:
      blockedPkgs: '["left-pad", "event-stream", "ua-parser-js", "ctx"]'
    rules:
      - action: deny
        when: request.package in blockedPkgs
        reason: package is blocklisted due to previous compromises
        remediation: Use reviewed internal alternatives or forked mirrors
        details:
          policy: block-known-bad-packages
