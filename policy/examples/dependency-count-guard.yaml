policies:
  - name: dependency-count-guard
    description: Flag diffs that add or change too many dependencies at once
    vars:
      changesList: 'changes'
      added: 'changesList.filter(c, c.?type.orValue("").lowerAscii() == "added")'
      total: 'size(changesList)'
      addedCount: 'size(added)'
    rules:
      - action: deny
        when: env.entrypoint == "diff_report" && total > 75
        reason: Too many dependency changes in a single diff (>75); split the change
      - action: warn
        when: env.entrypoint == "diff_report" && (total > 25 || addedCount > 10)
        reason: Large dependency change set detected; consider splitting or reviewing carefully
