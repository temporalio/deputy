# Block dependencies marked as deprecated or end-of-life
#
# Structure:
#   vulnerability.advisory.summary - Brief description
#   vulnerability.advisory.details - Full description
#
policies:
  - name: deprecated-module-block
    description: Block dependencies marked as deprecated or end-of-life
    vars:
      summary: 'vulnerability.?advisory.summary.orValue("").lowerAscii()'
      details: 'vulnerability.?advisory.details.orValue("").lowerAscii()'
      isDeprecatedText: 'summary.matches("(?i)deprecated|end[- ]of[- ]life|eol|unmaintained") || details.matches("(?i)deprecated|end[- ]of[- ]life|eol|unmaintained")'
    rules:
      - action: deny
        when: env.entrypoint in ["scan_vulnerability", "diff_vulnerability"] && isDeprecatedText
        reason: Dependency is deprecated or end-of-life
        remediation: Migrate to the recommended replacement before merging
