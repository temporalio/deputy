policies:
  - name: unstable-major-guard
    description: Flag v0/pre-release dependencies for extra scrutiny
    vars:
      # pkg is synthesized from request/component, so we can access it directly.
      # For change entrypoints (diff), we fall back to change fields.
      # Ecosystem values reach policies as canonical tokens, so no case folding is needed.
      ecosystem: 'pkg.ecosystem != "" ? pkg.ecosystem : change.?ecosystem.orValue("")'
      version: 'pkg.version != "" ? pkg.version.lowerAscii() : change.?targetVersion.orValue(change.?version.orValue("")).lowerAscii()'
      unstable: 'version.matches("^(v?0\\.)") || version.matches("(?i)(alpha|beta|rc|preview|snapshot)")'
      inScopeEco: 'ecosystem in ["go", "npm", "pypi"]'
    rules:
      - action: warn
        when: inScopeEco && unstable
        reason: Dependency is using an unstable or pre-release version
        remediation: Pin to the latest stable release before promotion
