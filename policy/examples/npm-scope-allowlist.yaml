apiVersion: policy.deputy.sh/v1alpha2
kind: PolicyBundle
metadata:
  title: "NPM scope guard"
policies:
  - name: enforce-approved-scopes
    description: Allow only approved npm scopes/packages in corp workloads
    vars:
      allowedScopes: '["@acme", "@corp", ""]'
      allowedPackages: '["lodash", "react", "typescript"]'
    rules:
      - action: deny
        when: request.ecosystem == "npm" &&
          !(allowedScopes.exists(s, s != "" && request.package.startsWith(s + "/")) ||
            allowedPackages.exists(p, p == request.package))
        reason: npm package outside approved scopes
        remediation: "Publish packages under @acme/* or request an exception"
        details:
          policy: enforce-approved-scopes
      - action: warn
        when: request.ecosystem == "npm" && request.package.startsWith("@acme/") && request.version.matches("(?i)(alpha|beta|rc)")
        reason: "@acme package is still in a pre-release channel"
