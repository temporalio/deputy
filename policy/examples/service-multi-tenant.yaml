# Service-level authorization policies for multi-tenant Deputy deployments.
#
# These policies evaluate at service_* entrypoints BEFORE operations execute,
# enabling RBAC/ABAC based on JWT claims for shared service deployments.
#
# Variables available at service entrypoints:
#   - jwt: JWT claims (jwt.sub, jwt.tenant, jwt.roles, jwt.teams, jwt.scopes, etc.)
#   - request: Request metadata (request.procedure, request.target)
#   - target: Target info (target.display)
#   - env: Context (env.command = "server", env.entrypoint)
#
# Example JWT token structure:
# {
#   "sub": "user:alice@acme.com",
#   "tenant": "acme-corp",
#   "roles": ["developer", "scanner"],
#   "teams": ["platform"],
#   "scopes": ["scan", "sbom"]
# }
#
# SECURITY CONSIDERATIONS:
#
# 1. Tenant Isolation: The tenant-isolation policies below compare whole path
#    components. For strict isolation, ensure your target naming convention
#    includes the tenant as a distinct path component (e.g.,
#    "github.com/acme-corp/repo") rather than a substring. Diffs are covered by
#    a separate rule because they name two targets and both must be authorized.
#
# 2. Required Claims: Consider adding 'tenant' to auth.required_claims in your
#    server config to ensure all authenticated requests have a tenant claim.
#
# 3. Allow Actions Do Not Override Denies: a deny from any policy is final at
#    service entrypoints, so the admin-full-access rule below records that an
#    admin was recognized without lifting the tenant rules. An admin who needs
#    cross-tenant access needs the deny rules to exempt them, which is what the
#    jwt.roles test in each rule would have to do. Audit admin actions carefully
#    in production either way.

policies:
  # Require tenant claim for authenticated users (defense in depth)
  - name: require-tenant-claim
    description: Ensure all authenticated users have a tenant identifier
    entrypoints:
      - service_scan_request
      - service_list_request
      - service_sbom_request
      - service_diff_request
      - service_secrets_request
      - service_graph_request
    rules:
      - action: deny
        when: |
          !jwt.anonymous &&
          (!has(jwt.tenant) || jwt.tenant == "")
        reason: "Tenant claim required for multi-tenant access"
        remediation: "Ensure your identity provider includes a 'tenant' claim in tokens"

  # Tenant isolation - users can only access their tenant's resources
  # Compares whole path components literally, never as a substring or regex
  - name: tenant-isolation
    description: |
      Restricts users to resources within their tenant namespace.

      The tenant must appear as a path component that owns something, so it is
      matched as "/<tenant>/" against the target with a leading "/" added. That
      requires the claim to name a namespace rather than any component:

        github.com/acme/repo            allowed, acme owns the repo
        git@github.com:acme/repo        allowed, ":" is folded to "/" first
        ghcr.io/acme/app:v1             allowed, tag does not affect the owner
        github.com/other/acme           denied, acme is only the repository name
        ghcr.io/other/app:acme          denied, acme is only the tag
        github.com/acme-corp-archive/r  denied, not a whole component

      Matching is a literal contains, so nothing in the claim is interpreted:
      a tenant such as "acme.com" cannot match "github.com/acmeXcom/repo" the
      way interpolating it into a regex would.

      The nonempty guard on request.target is required, not defensive: several
      procedures this rule covers name no resource at all (SecretsService
      Verify, ListDetectors, RegisterDetector, and SBOMService Diff), and
      without it they would be denied unconditionally. Those procedures are
      governed by require-tenant-claim and secrets-requires-security-team.

      Graph requests belong here too. BuildGraph, WhyDependency, and QueryGraph
      each name a resource and report its dependency structure, so omitting
      them lets a tenant map another tenant's repository.
    entrypoints:
      - service_scan_request
      - service_list_request
      - service_sbom_request
      - service_secrets_request
      - service_graph_request
    rules:
      - action: deny
        when: |
          !jwt.anonymous &&
          jwt.?tenant.orValue("") != "" &&
          request.?target.orValue("") != "" &&
          !("/" + request.target.replace(":", "/")).contains("/" + jwt.tenant + "/")
        reason: "Cross-tenant access denied - target does not belong to your tenant"
        remediation: "You can only access resources within your tenant namespace"

  # Tenant isolation for diffs, which name two independent resources
  - name: tenant-isolation-diff
    description: |
      A diff compares two targets, so both sides need authorizing. This rule is
      separate from tenant-isolation because diff_base and diff_target exist
      only on service_diff_request, and request.target reports the base side
      alone, which would let an authorized base carry another tenant's target.

      Unlike the single-target rule, an empty side denies here rather than
      skipping the check: a diff always names two resources, so a missing side
      is a malformed request, not a procedure without a target.
    entrypoints:
      - service_diff_request
    rules:
      - action: deny
        when: |
          !jwt.anonymous &&
          jwt.?tenant.orValue("") != "" &&
          ![diff_base, diff_target].all(t,
            ("/" + t.display_path.replace(":", "/")).contains("/" + jwt.tenant + "/")
          )
        reason: "Cross-tenant diff denied - both sides must belong to your tenant"
        remediation: "You can only diff resources within your tenant namespace"

  # A target that does not name the resource it fetches cannot be authorized by
  # matching its string, so refuse those rather than trying to match them.
  #
  # A trailing slash is the subtlest of them. The tenant rules require the tenant
  # to own something, expressed as "/<tenant>/" appearing in the path, and a
  # trailing slash makes the repository name look like an owner:
  # "https://github.com/other/acme/" contains "/acme/" while Git fetches the
  # repository acme owned by other.
  #
  # Git drops a URL fragment, so "https://github.com/other/repo.git#/acme/x"
  # reads as belonging to acme and clones other/repo.git. A query does the same.
  # A dot segment is resolved by whatever normalizes the path, so
  # "https://github.com/acme/../other/repo" matches "/acme/" and fetches
  # "/other/repo". And percent-encoding hides all of it from a string
  # comparison: "%2e%2e" is a dot segment the predicate cannot see, and the
  # policy has no business decoding what the fetch will decode differently.
  #
  # The dot-segment test compares whole components rather than searching for the
  # characters, so "repo..archive" is a legitimate name and stays allowed. That
  # distinction is the point: earlier revisions of these rules kept enumerating
  # the positions a tenant name could hide in, and each new position was another
  # bypass. Authorizing only targets whose string is what gets fetched is the
  # shape that ends that. Parsing the target properly is the real answer, and it
  # belongs in the engine rather than in a policy expression.
  - name: reject-unauthorizable-targets
    description: |
      Deputy also rejects fragments during remote target validation. This rule
      exists because a policy that authorizes a string has to see the same
      string the fetch will use, and an operator copying the tenant rules above
      into a deployment on an older build should not inherit the bypass.
    entrypoints:
      - service_scan_request
      - service_list_request
      - service_sbom_request
      - service_secrets_request
      - service_graph_request
    rules:
      - action: deny
        when: |
          request.?target.orValue("").contains("#") ||
          request.?target.orValue("").contains("?") ||
          request.?target.orValue("").contains("%") ||
          request.?target.orValue("").endsWith("/") ||
          ("/" + request.?target.orValue("").replace(":", "/"))
            .split("/").exists(c, c == "..")
        reason: "Target must name the resource it fetches, without a fragment, query, percent-encoding, or dot segment"
        remediation: "Name the resource directly: no #fragment, no ?query, no %encoding, and no .. path component"

  # Same rule for the two sides of a diff, which request.target does not report.
  - name: reject-unauthorizable-diff-targets
    entrypoints:
      - service_diff_request
    rules:
      - action: deny
        when: |
          [diff_base, diff_target].exists(t,
            t.display_path.contains("#") ||
            t.display_path.contains("?") ||
            t.display_path.contains("%") ||
            t.display_path.endsWith("/") ||
            ("/" + t.display_path.replace(":", "/")).split("/").exists(c, c == "..")
          )
        reason: "Both sides of a diff must name the resources they fetch"
        remediation: "Name both resources directly: no #fragment, no ?query, no %encoding, and no .. path component"

  # Require authentication for all operations
  - name: require-authentication
    entrypoints:
      - service_scan_request
      - service_list_request
      - service_sbom_request
      - service_diff_request
      - service_secrets_request
      - service_graph_request
    rules:
      - action: deny
        when: jwt.anonymous
        reason: "Authentication required"
        remediation: "Provide a valid JWT token in the Authorization header"

  # Role-based access for scanning operations
  - name: require-scanner-role
    entrypoints:
      - service_scan_request
      - service_secrets_request
    rules:
      - action: deny
        when: |
          !jwt.anonymous &&
          !jwt.?roles.orValue([]).exists(r, r in ["scanner", "security", "admin"])
        reason: "Scanner, security, or admin role required for scan operations"
        remediation: "Request the 'scanner' role from your administrator"

  # Team-based access for sensitive operations
  - name: secrets-requires-security-team
    entrypoints:
      - service_secrets_request
    rules:
      - action: deny
        when: |
          !jwt.anonymous &&
          !jwt.?teams.orValue([]).exists(t, t in ["security", "sre", "platform"])
        reason: "Security, SRE, or platform team membership required"
        remediation: "Secrets scanning is restricted to security-related teams"

  # Service account scope validation
  - name: service-account-scopes
    entrypoints:
      - service_scan_request
      - service_list_request
      - service_sbom_request
      - service_diff_request
      - service_secrets_request
      - service_graph_request
    rules:
      - action: deny
        when: |
          jwt.?sub.orValue("").startsWith("sa:") &&
          env.entrypoint == "service_scan_request" &&
          !jwt.?scopes.orValue([]).exists(s, s == "scan")
        reason: "Service account lacks 'scan' scope"
      - action: deny
        when: |
          jwt.?sub.orValue("").startsWith("sa:") &&
          env.entrypoint == "service_sbom_request" &&
          !jwt.?scopes.orValue([]).exists(s, s == "sbom")
        reason: "Service account lacks 'sbom' scope"
      - action: deny
        when: |
          jwt.?sub.orValue("").startsWith("sa:") &&
          env.entrypoint == "service_secrets_request" &&
          !jwt.?scopes.orValue([]).exists(s, s == "secrets")
        reason: "Service account lacks 'secrets' scope"

  # Records that an admin was recognized. This does not override the deny rules
  # above, because any deny is final; see the note at the top of this file.
  - name: admin-full-access
    entrypoints:
      - service_scan_request
      - service_list_request
      - service_sbom_request
      - service_diff_request
      - service_secrets_request
      - service_graph_request
    rules:
      - action: allow
        when: jwt.?roles.orValue([]).exists(r, r == "admin")
        reason: "Admin access granted"

  # Audit logging hint - add warning for high-privilege operations
  - name: audit-privileged-access
    entrypoints:
      - service_secrets_request
    rules:
      - action: warn
        when: |
          !jwt.anonymous &&
          jwt.?roles.orValue([]).exists(r, r == "admin")
        reason: "Admin performing secrets scan - ensure audit logging is enabled"
