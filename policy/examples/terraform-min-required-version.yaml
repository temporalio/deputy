# Terraform Required Version Guard (Diff)
#
# Enforce a minimum Terraform core version in required_version constraints.
# Catches when someone:
#   - Adds a new main.tf with an outdated required_version
#   - Changes an existing required_version to something too old
#   - Adds terraform config without specifying required_version
#
# The diff_dependency_change entrypoint fires for any added/changed/removed
# dependency, including Terraform requirements. This policy filters to
# terraform_core requirements and checks the parsed version constraint.
#
# Metadata available:
#   pkg.metadata.kind == "terraform_core"
#   pkg.metadata.min_major, min_minor, min_patch (parsed from constraint)
#   pkg.metadata.constraint (raw constraint string like ">= 1.5.0")
#
# Example:
#   deputy diff main feature-branch --policy policy/examples/terraform-min-required-version.yaml
#
# Scenario: PR adds infrastructure/main.tf with terraform { required_version = "~> 1.0" }
# Result: DENIED - constraint allows versions below 1.5.0

policies:
  - name: terraform-min-required-version
    description: Deny Terraform core constraints below the approved minimum
    entrypoints: ["diff_dependency_change"]
    vars:
      minMajor: 1
      minMinor: 5
      minPatch: 0
      hasMeta: 'pkg.metadata != null'
      isTerraformCore: 'pkg.ecosystem.lowerAscii() == "terraform" && hasMeta && pkg.metadata.kind == "terraform_core"'
      hasMin: 'hasMeta && "min_major" in pkg.metadata && "min_minor" in pkg.metadata && "min_patch" in pkg.metadata'
      belowMin: |
        hasMin && (
          pkg.metadata.min_major < minMajor ||
          (pkg.metadata.min_major == minMajor && pkg.metadata.min_minor < minMinor) ||
          (pkg.metadata.min_major == minMajor && pkg.metadata.min_minor == minMinor && pkg.metadata.min_patch < minPatch)
        )
    rules:
      - action: deny
        when: |
          env.entrypoint == "diff_dependency_change" &&
          isTerraformCore &&
          change.target_version != "" &&
          (!hasMin || belowMin)
        reason: "Terraform required_version must require >= 1.5.0"
        remediation: "Update terraform.required_version to \">= 1.5.0\" (or higher) in each module"
