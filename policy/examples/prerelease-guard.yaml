metadata:
  title: "Pre-release guardrails"
policies:
  - name: block-pre-release-in-prod
    description: Prevent alpha/beta/rc builds from entering prod artifact caches
    vars:
      prereleasePattern: |
        "(?i).*(alpha|beta|rc|preview)"
    rules:
      - action: deny
        when: pkg.?version.orValue("").matches(prereleasePattern)
        reason: pre-release build blocked
        remediation: Pin to the latest stable release
