# Secrets Detection Policy Examples
# Use with: deputy secrets --policy secrets-policy.yaml

policies:
  # Block any high-confidence secrets
  - name: block-high-confidence-secrets
    description: Block commits containing high-confidence secret detections
    entrypoints: ["secrets_report"]
    rules:
      - action: deny
        when: secrets.exists(s, s.confidence >= 0.9)
        reason: "High-confidence secrets detected - remove before committing"
        remediation: |
          1. Remove the secret from your code
          2. Rotate the credential immediately
          3. Use environment variables or a secrets manager

  # Block verified active secrets (stricter)
  - name: block-verified-secrets
    description: Block any secret that has been verified as active
    entrypoints: ["secrets_finding"]
    rules:
      - action: deny
        when: secret.validated == true
        reason: "Verified active secret detected - this credential is live and exposed"
        remediation: |
          CRITICAL: This secret is confirmed active!
          1. Rotate the credential IMMEDIATELY
          2. Check access logs for unauthorized usage
          3. Remove from code and use secure storage

  # Block cloud provider credentials
  - name: block-cloud-credentials
    description: Never allow cloud provider credentials in code
    entrypoints: ["secrets_finding"]
    vars:
      cloudSecrets:
        - "aws_access_key"
        - "aws_secret_key"
        - "gcp_api_key"
        - "gcp_service_account_key"
        - "azure_sas_token"
        - "digitalocean_token"
    rules:
      - action: deny
        when: secret.type in cloudSecrets
        reason: "Cloud credentials must never be committed to source control"
        remediation: |
          Use one of these alternatives:
          - Environment variables
          - AWS IAM roles / GCP service accounts
          - HashiCorp Vault
          - Cloud-native secret managers (AWS Secrets Manager, GCP Secret Manager)

  # Block payment/billing secrets
  - name: block-payment-secrets
    description: Payment credentials are especially sensitive
    entrypoints: ["secrets_finding"]
    vars:
      paymentSecrets:
        - "stripe_key"
        - "sendgrid_key"
    rules:
      - action: deny
        when: secret.type in paymentSecrets
        reason: "Payment-related credentials require extra protection"
        remediation: |
          Payment credentials should NEVER be in source control.
          Use restricted API keys with minimal permissions.

  # Allow low-confidence findings with warning
  - name: allow-low-confidence
    description: Low confidence detections may be false positives
    entrypoints: ["secrets_finding"]
    rules:
      - action: warn
        when: secret.confidence < 0.7
        reason: "Low-confidence detection - verify if this is a real secret"

  # Block secrets in specific file patterns
  - name: block-secrets-in-configs
    description: Extra scrutiny for configuration files
    entrypoints: ["secrets_finding"]
    rules:
      - action: deny
        when: |
          secret.confidence >= 0.8 && (
            secret.file.endsWith(".yaml") ||
            secret.file.endsWith(".yml") ||
            secret.file.endsWith(".json") ||
            secret.file.endsWith(".env") ||
            secret.file.endsWith(".config")
          )
        reason: "Secrets in configuration files are high risk"

  # CI/CD specific policy - stricter for main branches
  - name: strict-main-branch
    description: Zero tolerance for secrets on main/master branches
    entrypoints: ["secrets_report"]
    rules:
      - action: deny
        when: report.secretsFound > 0
        reason: "No secrets allowed on protected branches"

  # Allow specific known patterns (for testing)
  - name: allow-test-patterns
    description: Allow obvious test/example patterns
    entrypoints: ["secrets_finding"]
    rules:
      - action: allow
        when: |
          secret.file.contains("test") ||
          secret.file.contains("example") ||
          secret.file.contains("fixture") ||
          secret.redacted.contains("xxxx") ||
          secret.redacted.contains("example")
        reason: "Test/example patterns are allowed"

  # Container image specific policy
  - name: block-secrets-in-base-images
    description: Secrets in base image layers indicate upstream issues
    entrypoints: ["secrets_finding"]
    rules:
      - action: warn
        when: secret.in_base_image == true
        reason: "Secret found in base image layer - consider using a different base image"

  # Limit total secrets in a scan
  - name: max-secrets-threshold
    description: Too many secrets indicates systemic issues
    entrypoints: ["secrets_report"]
    rules:
      - action: deny
        when: report.secretsFound > 10
        reason: "Too many secrets detected - review security practices"
        remediation: |
          Multiple secrets detected. Consider:
          1. Security training for the team
          2. Pre-commit hooks to prevent future issues
          3. Secrets management solution
          4. Code review focusing on security

  # Block private keys absolutely
  - name: block-private-keys
    description: Private keys should never be in source control
    entrypoints: ["secrets_finding"]
    rules:
      - action: deny
        when: secret.type == "private_key"
        reason: "Private keys must never be committed"
        remediation: |
          Private keys should be:
          - Stored in secure key management systems
          - Generated locally and never shared
          - Rotated immediately if exposed
