policies:
  - name: critical-runtime-pinning
    description: Encourage explicit version bumps when touching critical runtime modules
    vars:
      criticalModules:
        - golang.org/x/crypto
        - golang.org/x/net
        - golang.org/x/sys
        - github.com/aws/aws-sdk-go-v2
        - github.com/sirupsen/logrus
        - go.uber.org/zap
      name: 'pkg.name.lowerAscii()'
      base: 'change.base_version.lowerAscii()'
      target: 'change.target_version.lowerAscii()'
      unchanged: 'base != "" && base == target'
      isCritical: 'criticalModules.exists(c, name.startsWith(c.lowerAscii()))'
    rules:
      - action: warn
        when: env.entrypoint == "diff_dependency_change" && isCritical && unchanged
        reason: Critical runtime module changed without a version bump; consider explicit upgrade
