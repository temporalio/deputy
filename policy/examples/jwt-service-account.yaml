# JWT Service Account Policies
#
# Policies for validating service account tokens and enforcing
# machine identity requirements in CI/CD and production environments.
#
# Uses CEL optionals (?.field and .orValue()) for cleaner null-safe access.
# See: https://github.com/google/cel-spec/wiki/proposal-246

policies:
  - name: jwt-require-service-account-ci
    description: CI environments must use service account tokens
    entrypoints: ["go_artifact_request", "npm_artifact_request", "pypi_artifact_request"]
    rules:
      - action: deny
        when: |
          jwt.?env.orValue("") == "ci" &&
          !jwt.?sub.orValue("").startsWith("sa:")
        reason: "CI pipelines must use service account tokens"
        remediation: "Configure your CI to use a service account token instead of user credentials"

  - name: jwt-validate-service-metadata
    description: Service accounts must have required metadata claims
    entrypoints: ["go_artifact_request", "npm_artifact_request", "pypi_artifact_request"]
    rules:
      - action: deny
        when: |
          jwt.?sub.orValue("").startsWith("sa:") &&
          jwt.?service_name.orValue("") == ""
        reason: "Service account tokens must include service_name claim"
      - action: deny
        when: |
          jwt.?sub.orValue("").startsWith("sa:") &&
          jwt.?service_version.orValue("") == ""
        reason: "Service account tokens must include service_version claim"

  - name: jwt-service-rate-tier
    description: Enforce different access tiers for services
    entrypoints: ["go_artifact_request", "npm_artifact_request"]
    rules:
      # Block low-tier services from accessing premium packages
      - action: deny
        when: |
          jwt.?tier.orValue("free") == "free" &&
          request.?package.orValue(request.?module.orValue("")).contains("/premium/")
        reason: "Premium packages require elevated service tier"
        remediation: "Upgrade your service tier or use standard packages"
