# Release - Build and publish with GoReleaser
#
# Triggered on version tags. Runs security gate, builds cross-platform
# binaries with GoReleaser, generates SBOM with Deputy (dogfooding).

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write        # Release creation and asset uploads
  # security-events: write # SARIF upload (requires GHAS)
  id-token: write        # Sigstore OIDC keyless signing
  pull-requests: write   # Homebrew cask PR creation

jobs:
  # Security gate before release
  security:
    name: Security Gate
    uses: temporalio/deputy/.github/workflows/scan.yml@main
    with:
      policy: policy/ci/release-gate.yaml
      fail-on-policy-violation: true
      upload-sarif: false
      # upload-sarif: true          # requires GHAS (security-events: write)
      # sarif-category: deputy-release-scan

  # Build and release with GoReleaser
  release:
    name: Release
    needs: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Install Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Generate SBOM with Deputy (dogfooding)
      - name: Setup Deputy
        uses: temporalio/deputy/actions/setup@main

      - name: Generate and sign SBOM
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Generate SBOMs with Deputy (dogfooding)
          deputy sbom --format cyclonedx-json --output "deputy_${TAG}.sbom.cdx.json"
          deputy sbom --format spdx-json --output "deputy_${TAG}.sbom.spdx.json"

          # Sign SBOMs with Cosign (keyless, bundle format)
          cosign sign-blob --yes \
            --bundle "deputy_${TAG}.sbom.cdx.json.bundle.json" \
            "deputy_${TAG}.sbom.cdx.json"

          cosign sign-blob --yes \
            --bundle "deputy_${TAG}.sbom.spdx.json.bundle.json" \
            "deputy_${TAG}.sbom.spdx.json"

      - name: Upload SBOM to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" \
            "deputy_${TAG}.sbom.cdx.json" \
            "deputy_${TAG}.sbom.cdx.json.bundle.json" \
            "deputy_${TAG}.sbom.spdx.json" \
            "deputy_${TAG}.sbom.spdx.json.bundle.json"
