# Security Scan Workflow
#
# A composable workflow for vulnerability scanning with Deputy.
# Call this from any repository to get consistent security scanning.
#
# Works with or without GitHub Advanced Security (GHAS):
# - With GHAS: Uploads SARIF to GitHub Security tab for rich integration
# - Without GHAS: Posts scan summary as PR comment (automatic fallback)
#
# Usage:
#   jobs:
#     security:
#       uses: temporalio/deputy/.github/workflows/scan.yml@main
#       with:
#         policy: policy/ci/security-gate.yaml
#       permissions:
#         # security-events: write  # For SARIF upload (requires GHAS)
#         contents: read
#         pull-requests: write      # For PR comment fallback

name: Scan

on:
  workflow_call:
    inputs:
      target:
        description: 'Path to scan (default: current directory)'
        type: string
        required: false
        default: '.'
      policy:
        description: 'Path to policy file'
        type: string
        required: false
        default: ''
      fail-on-findings:
        description: 'Fail workflow if vulnerabilities are found'
        type: boolean
        required: false
        default: false
      fail-on-policy-violation:
        description: 'Fail workflow on policy violations'
        type: boolean
        required: false
        default: true
      upload-sarif:
        description: 'Upload SARIF to GitHub Security tab (requires GHAS)'
        type: boolean
        required: false
        default: false
      sarif-category:
        description: 'SARIF category for GitHub Security'
        type: string
        required: false
        default: 'deputy-scan'

    outputs:
      findings-count:
        description: 'Total vulnerabilities found'
        value: ${{ jobs.scan.outputs.findings-count }}
      critical-count:
        description: 'Critical severity count'
        value: ${{ jobs.scan.outputs.critical-count }}
      high-count:
        description: 'High severity count'
        value: ${{ jobs.scan.outputs.high-count }}
      policy-violations:
        description: 'Number of policy violations'
        value: ${{ jobs.scan.outputs.policy-violations }}

jobs:
  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    outputs:
      findings-count: ${{ steps.scan.outputs.findings-count }}
      critical-count: ${{ steps.scan.outputs.critical-count }}
      high-count: ${{ steps.scan.outputs.high-count }}
      policy-violations: ${{ steps.scan.outputs.policy-violations }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Deputy
        uses: temporalio/deputy/actions/setup@main

      - name: Run scan
        id: scan
        uses: temporalio/deputy/actions/scan@main
        with:
          target: ${{ inputs.target }}
          policy: ${{ inputs.policy }}
          fail-on-findings: ${{ inputs.fail-on-findings }}
          fail-on-policy-violation: ${{ inputs.fail-on-policy-violation }}
          upload-sarif: ${{ inputs.upload-sarif }}
          sarif-category: ${{ inputs.sarif-category }}
