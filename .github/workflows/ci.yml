# CI - Build and Test
#
# Runs on all pushes and pull requests to ensure code quality.

name: CI

on:
  push:
    branches: [main]
  # No branch filter. A stacked pull request targets its parent branch rather
  # than main, and a filter of [main] gives those pull requests no checks at
  # all, silently: the workflow does not appear as pending or skipped, it
  # simply never exists. Reviewing an unverified stack is worse than reviewing
  # one large verified branch, so this stays unfiltered.
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Build binary for blackbox tests
        run: go build -o deputy-test-binary .

      - name: Test
        env:
          DEPUTY_TEST_BINARY: ${{ github.workspace }}/deputy-test-binary
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage.out

