name: anthropic-wif-cli-demo
on:
  push:
    branches: [anthropic-wif-test]
permissions:
  id-token: write
  contents: read
jobs:
  claude-cli:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);

      - name: Exchange OIDC token for a federated Anthropic access token
        run: |
          resp=$(curl -sS https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @- <<JSON
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "fdrl_01FRty5eQYMGP2xh1AK3R5rk",
            "organization_id": "28abd3d1-8842-4f2b-b558-c5b9700e3caa",
            "service_account_id": "svac_01D5VqGf1Xvw7BNtFkt1jsLT",
            "workspace_id": "wrkspc_01BZ6jESnWXxTpRTs59XtnKf"
          }
          JSON
          )
          token=$(printf '%s' "$resp" | jq -r '.access_token // empty')
          [ -z "$token" ] && { echo "exchange failed"; printf '%s\n' "$resp" | jq .; exit 1; }
          echo "::add-mask::$token"
          echo "FED_TOKEN=$token" >> "$GITHUB_ENV"
          echo "exchange OK (scope $(printf '%s' "$resp" | jq -r .scope))"

      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
          claude --version

      - name: Run Claude Code with the federated token (try CLAUDE_CODE_OAUTH_TOKEN)
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ env.FED_TOKEN }}
        run: |
          echo "== attempt 1: CLAUDE_CODE_OAUTH_TOKEN =="
          claude -p "Reply with exactly: CLI WIF OK" --output-format text || echo "exit=$?"

      - name: Run Claude Code with the federated token (try ANTHROPIC_AUTH_TOKEN)
        continue-on-error: true
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ env.FED_TOKEN }}
        run: |
          echo "== attempt 2: ANTHROPIC_AUTH_TOKEN =="
          claude -p "Reply with exactly: CLI WIF OK" --output-format text || echo "exit=$?"
