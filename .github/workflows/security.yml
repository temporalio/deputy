# Security - Vulnerability Scanning
#
# Deputy scanning itself (dogfooding). Runs on pushes, PRs, and weekly.
# Uses Deputy's own reusable workflow for consistent scanning.

name: Security

on:
  push:
    branches: [main]
  # No branch filter, matching ci.yml: a stacked pull request targets its
  # parent branch, so filtering on main leaves every layer of a stack
  # unscanned.
  pull_request:
  schedule:
    # Weekly scan on Mondays at 9am UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  # Full security scan on all events
  scan:
    name: Scan
    uses: temporalio/deputy/.github/workflows/scan.yml@main
    with:
      policy: policy/ci/security-gate.yaml
      upload-sarif: false
      # upload-sarif: true        # requires GHAS (security-events: write)
      # sarif-category: deputy-self-scan

  # PR-specific checks with dependency diff
  pr-gate:
    name: PR Gate
    if: github.event_name == 'pull_request'
    uses: temporalio/deputy/.github/workflows/pr-gate.yml@main
    with:
      scan-policy: policy/ci/security-gate.yaml
      diff-policy: policy/ci/pr-review.yaml
      comment-on-pr: true
      fail-on-new-vulnerabilities: true
