  push:
    branches: [claude-wif-action-test]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
