syntax = "proto3";

package deputy.secrets.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "deputy/secrets/v1/secrets.proto";
import "deputy/target/v1/target.proto";
import "deputy/policy/v1/policy.proto";

option go_package = "github.com/picatz/deputy/gen/deputy/secrets/v1;secretsv1";

// SecretsService provides secret detection capabilities.
//
// Security Model:
// The service supports different target types with mode-specific security constraints:
//
// In-Process / Local Daemon Mode:
//   - Full filesystem access (local directories, files)
//   - Local Docker daemon access (docker-daemon://)
//   - Local archives (tarball://, oci-archive://, oci-layout://)
//   - Git history scanning with local repo access
//
// Remote Server Mode:
//   - Only remote-accessible targets are allowed
//   - Accepted: git URLs, container registry refs
//   - Rejected: local paths (/path, ./path, ~/path, .)
//   - Rejected: local transports (docker-daemon://, tarball://, etc.)
service SecretsService {
  // Scan performs secret detection on a target.
  // The target can be a directory, file, Git repository, container image, or archive.
  rpc Scan(ScanRequest) returns (ScanResponse);

  // StreamScan performs secret detection with streaming progress updates.
  // Useful for large scans (git history, deep container scans) where clients want real-time feedback.
  rpc StreamScan(StreamScanRequest) returns (stream ScanProgress);

  // ScanHistory scans git history for secrets.
  // This is a specialized scan mode for finding secrets introduced/removed across commits.
  rpc ScanHistory(ScanHistoryRequest) returns (ScanHistoryResponse);

  // ScanDiff scans changes between two git refs for secrets.
  // Ideal for CI/CD: only scan new changes in a PR or commit range.
  rpc ScanDiff(ScanDiffRequest) returns (ScanDiffResponse);

  // Verify attempts to validate detected secrets.
  // Returns verification status for each finding.
  rpc Verify(VerifyRequest) returns (VerifyResponse);

  // ListDetectors returns available secret detectors.
  rpc ListDetectors(ListDetectorsRequest) returns (ListDetectorsResponse);

  // RegisterDetector registers a custom detector (plugin support).
  rpc RegisterDetector(RegisterDetectorRequest) returns (RegisterDetectorResponse);
}

// ScanRequest specifies what to scan and how.
message ScanRequest {
  // Target is the scan target (path, URL, image reference, archive, etc.).
  // When empty, defaults to current working directory.
  // Maximum length prevents denial-of-service via excessively long strings.
  string target = 1 [(buf.validate.field).string.max_len = 4096];

  // Options configure scan behavior.
  ScanOptions options = 2;
}

// ScanOptions configures secret scan behavior.
message ScanOptions {
  // DetectorIds filters to specific detectors. Empty means all enabled detectors.
  // Maximum 100 detectors to prevent abuse.
  repeated string detector_ids = 1 [(buf.validate.field).repeated = {max_items: 100, items: {string: {max_len: 128}}}];

  // SecretTypes filters to specific secret types. Empty means all types.
  // Maximum 100 types to prevent abuse.
  repeated SecretType secret_types = 2 [(buf.validate.field).repeated.max_items = 100];

  // MinConfidence filters findings below this threshold (0.0-1.0).
  float min_confidence = 3 [(buf.validate.field).float = {gte: 0.0, lte: 1.0}];

  // Verify enables automatic verification of detected secrets.
  bool verify = 4;

  // IncludePatterns are glob patterns for files to include.
  // Maximum 100 patterns to prevent abuse.
  repeated string include_patterns = 5 [(buf.validate.field).repeated = {max_items: 100, items: {string: {max_len: 512}}}];

  // ExcludePatterns are glob patterns for files to exclude.
  // Defaults include: node_modules, .git, vendor, __pycache__, etc.
  // Maximum 100 patterns to prevent abuse.
  repeated string exclude_patterns = 6 [(buf.validate.field).repeated = {max_items: 100, items: {string: {max_len: 512}}}];

  // EntropyDetection enables high-entropy string detection.
  // Disabled by default to reduce false positives.
  bool entropy_detection = 7;

  // EntropyThreshold is the minimum Shannon entropy to flag (0.0-8.0).
  // Only used when entropy_detection is enabled. Default is 4.5.
  float entropy_threshold = 8 [(buf.validate.field).float = {gte: 0.0, lte: 8.0}];

  // Deep enables deep scanning (container layer extraction, binary strings).
  bool deep = 9;

  // BaselinePath is the path to a baseline file for filtering known secrets.
  // Maximum length prevents abuse.
  string baseline_path = 10 [(buf.validate.field).string.max_len = 1024];

  // PolicyPaths are paths to policy files to evaluate.
  // Maximum 20 policy paths to prevent abuse.
  repeated string policy_paths = 11 [(buf.validate.field).repeated = {max_items: 20, items: {string: {max_len: 1024}}}];

  // Platform specifies the target platform for container images (e.g., "linux/amd64").
  string platform = 12 [(buf.validate.field).string.max_len = 64];

  // TargetHint provides disambiguation when the target string is ambiguous.
  TargetHint target_hint = 13;
}

// TargetHint disambiguates the target type when auto-detection is insufficient.
message TargetHint {
  // Kind explicitly specifies the target type.
  deputy.target.v1.TargetKind kind = 1;

  // ImageTransport specifies how to fetch container images.
  // Values: "remote" (default), "daemon", "tarball", "oci-archive", "oci-layout".
  string image_transport = 2 [(buf.validate.field).string = {in: ["", "remote", "daemon", "tarball", "oci-archive", "oci-layout"]}];
}

// ScanResponse contains the complete secret scan results.
message ScanResponse {
  // Target describes what was scanned.
  deputy.target.v1.Target target = 1;

  // GeneratedAt is when this report was generated.
  google.protobuf.Timestamp generated_at = 2;

  // Findings are all detected secrets.
  repeated Finding findings = 3;

  // Stats summarizes the scan results.
  Stats stats = 4;

  // PolicyActions lists policy evaluation outcomes.
  repeated deputy.policy.v1.Action policy_actions = 5;

  // Warnings contains non-fatal issues encountered during scanning.
  repeated string warnings = 6 [(buf.validate.field).repeated = {max_items: 1000, items: {string: {max_len: 4096}}}];
}

// StreamScanRequest specifies what to scan with streaming progress.
message StreamScanRequest {
  // Target is the scan target.
  // Maximum length prevents denial-of-service via excessively long strings.
  string target = 1 [(buf.validate.field).string.max_len = 4096];

  // Options configure scan behavior.
  ScanOptions options = 2;
}

// ScanProgress provides streaming updates during a secret scan.
message ScanProgress {
  // Phase indicates the current scan phase.
  ScanPhase phase = 1;

  // Message provides human-readable progress information.
  string message = 2 [(buf.validate.field).string.max_len = 1024];

  // Progress is the completion percentage (0-100) for the current phase.
  int32 progress = 3 [(buf.validate.field).int32 = {gte: 0, lte: 100}];

  // FilesScanned is the running count of scanned files.
  int32 files_scanned = 4 [(buf.validate.field).int32.gte = 0];

  // SecretsFound is the running count of discovered secrets.
  int32 secrets_found = 5 [(buf.validate.field).int32.gte = 0];

  // CurrentFile is the file currently being scanned.
  string current_file = 6 [(buf.validate.field).string.max_len = 4096];

  // Result is populated only in the final message when phase is SCAN_PHASE_COMPLETE.
  ScanResponse result = 10;

  // Error is populated if the scan failed.
  string error = 11 [(buf.validate.field).string.max_len = 4096];
}

// ScanPhase indicates the current phase of a secret scan operation.
enum ScanPhase {
  SCAN_PHASE_UNSPECIFIED = 0;
  SCAN_PHASE_INITIALIZING = 1;
  SCAN_PHASE_RESOLVING_TARGET = 2;
  SCAN_PHASE_EXTRACTING_FILES = 3;
  SCAN_PHASE_SCANNING = 4;
  SCAN_PHASE_VERIFYING = 5;
  SCAN_PHASE_EVALUATING_POLICIES = 6;
  SCAN_PHASE_COMPLETE = 7;
  SCAN_PHASE_FAILED = 8;
}

// ScanHistoryRequest configures git history scanning.
message ScanHistoryRequest {
  // Target is the git repository to scan.
  // Maximum length prevents denial-of-service via excessively long strings.
  string target = 1 [(buf.validate.field).string.max_len = 4096];

  // Options configure scan behavior.
  ScanOptions options = 2;

  // MaxCommits limits the number of commits to scan (0 = unlimited).
  // Maximum 100000 to prevent excessive scanning.
  int32 max_commits = 3 [(buf.validate.field).int32 = {gte: 0, lte: 100000}];

  // Since is the start date for history scanning (RFC 3339 format).
  string since = 4 [(buf.validate.field).string.max_len = 64];

  // Until is the end date for history scanning (RFC 3339 format).
  string until = 5 [(buf.validate.field).string.max_len = 64];

  // Branch limits scanning to a specific branch.
  string branch = 6 [(buf.validate.field).string.max_len = 256];

  // IncludeRemoved includes secrets that have been removed from HEAD.
  bool include_removed = 7;
}

// ScanHistoryResponse contains git history scan results.
message ScanHistoryResponse {
  // Target describes what was scanned.
  deputy.target.v1.Target target = 1;

  // GeneratedAt is when this report was generated.
  google.protobuf.Timestamp generated_at = 2;

  // Findings are all detected secrets with git context.
  repeated Finding findings = 3;

  // CommitsScanned is the number of commits analyzed.
  int32 commits_scanned = 4 [(buf.validate.field).int32.gte = 0];

  // Stats summarizes the scan results.
  Stats stats = 5;

  // PolicyActions lists policy evaluation outcomes.
  repeated deputy.policy.v1.Action policy_actions = 6;

  // Warnings contains non-fatal issues encountered during scanning.
  repeated string warnings = 7 [(buf.validate.field).repeated = {max_items: 1000, items: {string: {max_len: 4096}}}];
}

// ScanDiffRequest configures diff-based scanning.
message ScanDiffRequest {
  // Target is the git repository to scan.
  // Maximum length prevents denial-of-service via excessively long strings.
  string target = 1 [(buf.validate.field).string.max_len = 4096];

  // BaseRef is the base reference for comparison (branch, tag, commit).
  // Required field.
  string base_ref = 2 [(buf.validate.field).string = {min_len: 1, max_len: 256}];

  // TargetRef is the target reference for comparison.
  // Required field.
  string target_ref = 3 [(buf.validate.field).string = {min_len: 1, max_len: 256}];

  // Options configure scan behavior.
  ScanOptions options = 4;
}

// ScanDiffResponse contains diff-based scan results.
message ScanDiffResponse {
  // Target describes what was scanned.
  deputy.target.v1.Target target = 1;

  // GeneratedAt is when this report was generated.
  google.protobuf.Timestamp generated_at = 2;

  // BaseRef is the base reference that was compared.
  string base_ref = 3 [(buf.validate.field).string.max_len = 256];

  // TargetRef is the target reference that was compared.
  string target_ref = 4 [(buf.validate.field).string.max_len = 256];

  // AddedFindings are secrets introduced in target_ref.
  repeated Finding added_findings = 5;

  // RemovedFindings are secrets present in base_ref but not target_ref.
  repeated Finding removed_findings = 6;

  // Stats summarizes the scan results.
  Stats stats = 7;

  // PolicyActions lists policy evaluation outcomes.
  repeated deputy.policy.v1.Action policy_actions = 8;

  // Warnings contains non-fatal issues encountered during scanning.
  repeated string warnings = 9 [(buf.validate.field).repeated = {max_items: 1000, items: {string: {max_len: 4096}}}];
}

// VerifyRequest asks to verify detected secrets.
message VerifyRequest {
  // Findings to verify. These should come from a previous scan.
  // Maximum 1000 findings per request to prevent abuse.
  repeated Finding findings = 1 [(buf.validate.field).repeated.max_items = 1000];

  // RateLimit is max verification requests per second (0 = no limit).
  // Maximum 100 to prevent API abuse.
  int32 rate_limit = 2 [(buf.validate.field).int32 = {gte: 0, lte: 100}];

  // Timeout is max time per verification in seconds.
  // Maximum 60 seconds per verification.
  int32 timeout_seconds = 3 [(buf.validate.field).int32 = {gte: 0, lte: 60}];
}

// VerifyResponse contains verification results.
message VerifyResponse {
  // Results are findings with updated verification status.
  repeated Finding results = 1;

  // VerifiedCount is how many were successfully verified.
  int32 verified_count = 2 [(buf.validate.field).int32.gte = 0];

  // FailedCount is how many verification attempts failed.
  int32 failed_count = 3 [(buf.validate.field).int32.gte = 0];

  // SkippedCount is how many were skipped (unsupported type, rate limited, etc.).
  int32 skipped_count = 4 [(buf.validate.field).int32.gte = 0];
}

// ListDetectorsRequest asks for available detectors.
message ListDetectorsRequest {
  // IncludeDisabled includes detectors that are currently disabled.
  bool include_disabled = 1;

  // Sources filters to specific detector sources.
  // Maximum 10 sources to prevent abuse.
  repeated DetectorSource sources = 2 [(buf.validate.field).repeated.max_items = 10];
}

// ListDetectorsResponse contains available detectors.
message ListDetectorsResponse {
  // Detectors are all matching detectors.
  repeated DetectorInfo detectors = 1;
}

// RegisterDetectorRequest registers a custom detector.
message RegisterDetectorRequest {
  // Detector describes the detector to register.
  // Required field.
  DetectorInfo detector = 1 [(buf.validate.field).required = true];

  // Pattern is the regex pattern for detection (required for pattern-based detectors).
  // Maximum 4096 characters to prevent ReDoS via complex patterns.
  string pattern = 2 [(buf.validate.field).string.max_len = 4096];

  // PluginPath is the path to the plugin binary (required for plugin-based detectors).
  // Maximum 1024 characters.
  string plugin_path = 3 [(buf.validate.field).string.max_len = 1024];
}

// RegisterDetectorResponse confirms detector registration.
message RegisterDetectorResponse {
  // Detector is the registered detector with assigned ID.
  DetectorInfo detector = 1;
}
