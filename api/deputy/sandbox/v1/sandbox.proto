syntax = "proto3";

package deputy.sandbox.v1;

option go_package = "github.com/picatz/deputy/gen/deputy/sandbox/v1;sandboxv1";

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// SandboxService provides sandbox management and execution.
// This service enables isolated execution of commands across multiple contexts:
// plugins, AI agents, remediation commands, and the `deputy exec` command.
//
// The service is designed for in-process use but can be exposed over the network
// for enterprise deployments requiring centralized sandbox infrastructure.
service SandboxService {
  // ListRuntimes returns available sandbox runtimes on this host.
  rpc ListRuntimes(ListRuntimesRequest) returns (ListRuntimesResponse);

  // Execute runs a command in a sandbox and streams execution events.
  rpc Execute(ExecuteRequest) returns (stream ExecuteEvent);

  // GetCapabilities returns detailed capabilities for a specific runtime.
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
}

// SandboxRuntimeService is implemented by external sandbox runtime plugins.
// Plugins are discovered via PATH as executables named `deputy-sandbox-<name>`
// and communicate over Unix sockets using ConnectRPC.
service SandboxRuntimeService {
  // GetInfo returns metadata about this sandbox runtime plugin.
  rpc GetInfo(GetRuntimeInfoRequest) returns (GetRuntimeInfoResponse);

  // Execute runs a command in this runtime and streams events.
  rpc Execute(RuntimeExecuteRequest) returns (stream ExecuteEvent);

  // Cleanup releases resources from a previous execution.
  rpc Cleanup(CleanupRequest) returns (CleanupResponse);

  // SyncChanges copies workspace changes from the sandbox to the original workspace.
  // This is used after execution when review_before_commit is enabled.
  // The user reviews the changes, then calls this to accept them.
  // Note: This does NOT create a git commit - the user commits manually.
  rpc SyncChanges(SyncChangesRequest) returns (SyncChangesResponse);

  // GetChanges returns the list of files changed during execution.
  // This is used for the change review workflow.
  rpc GetChanges(GetChangesRequest) returns (GetChangesResponse);
}

// Runtime identifies a sandbox runtime backend.
// New runtimes can be added without breaking existing clients.
enum Runtime {
  // Unspecified runtime - will use default based on platform.
  RUNTIME_UNSPECIFIED = 0;

  // No sandboxing - trusted execution with full access.
  // Use for built-in plugins or when sandboxing is explicitly disabled.
  RUNTIME_NONE = 1;

  // Docker container runtime.
  // Cross-platform via Docker Desktop (macOS, Windows) or native (Linux).
  RUNTIME_DOCKER = 2;

  // Podman container runtime.
  // Rootless containers, alternative to Docker.
  RUNTIME_PODMAN = 3;

  // gVisor (runsc) for application-level sandboxing.
  // Provides strong isolation via user-space kernel. Linux only.
  RUNTIME_GVISOR = 4;

  // containerd runtime (direct, without Docker).
  RUNTIME_CONTAINERD = 5;

  // Bubblewrap (bwrap) for lightweight Linux sandboxing.
  // Uses namespaces without full container overhead.
  RUNTIME_BWRAP = 6;

  // macOS sandbox-exec for native macOS sandboxing.
  RUNTIME_SANDBOX_EXEC = 7;

  // Linux namespaces (native, no container runtime).
  RUNTIME_NAMESPACES = 8;

  // Firecracker microVM for maximum isolation.
  // Future: requires KVM, primarily for Linux cloud environments.
  RUNTIME_FIRECRACKER = 9;

  // External plugin-provided runtime.
  // Used when runtime is provided by a deputy-sandbox-* plugin.
  RUNTIME_PLUGIN = 10;

  // Linux Landlock LSM for lightweight filesystem sandboxing.
  // No root/container overhead, uses kernel security module. Linux 5.13+.
  RUNTIME_LANDLOCK = 11;

  // Apple Virtualization.framework for VM-based isolation.
  // macOS 26+ (Tahoe), Apple Silicon only. One VM per container.
  RUNTIME_APPLE_CONTAINER = 12;
}

// Mode controls the sandbox's filesystem access level.
enum Mode {
  // Unspecified mode - uses configuration default.
  MODE_UNSPECIFIED = 0;

  // Read-only filesystem access.
  // The sandbox can read the workspace but cannot write any files.
  MODE_READ_ONLY = 1;

  // Read/write within workspace only.
  // The sandbox can modify files in the workspace directory but nowhere else.
  // This is the recommended default for most use cases.
  MODE_WORKSPACE_WRITE = 2;

  // Full access (dangerous).
  // The sandbox has unrestricted filesystem access.
  // Only use for trusted code that requires system-wide modifications.
  MODE_FULL_ACCESS = 3;

  // Network isolated with workspace write.
  // Combines workspace write access with no network access.
  // Useful for build processes that shouldn't phone home.
  MODE_NETWORK_ISOLATED = 4;

  // Ephemeral copy-on-write mode.
  // All changes are discarded after execution.
  // Useful for testing or exploring potentially destructive commands.
  MODE_EPHEMERAL = 5;
}

// NetworkMode controls network access from the sandbox.
enum NetworkMode {
  // Unspecified - uses configuration default.
  NETWORK_MODE_UNSPECIFIED = 0;

  // No network access.
  // The sandbox cannot make any network connections.
  // This is the recommended default for security.
  NETWORK_MODE_NONE = 1;

  // Host network.
  // The sandbox shares the host's network namespace.
  // Use with caution - reduces isolation.
  NETWORK_MODE_HOST = 2;

  // Bridged network.
  // The sandbox gets its own network namespace with NAT to host.
  NETWORK_MODE_BRIDGE = 3;

  // Allowlist-based network access.
  // Only connections to hosts in network_allowlist are permitted.
  NETWORK_MODE_ALLOWLIST = 4;
}

// WorkspaceIsolationMode controls how workspace files are isolated during execution.
// This provides defense-in-depth for supply chain security by controlling how
// commands can interact with the workspace filesystem.
enum WorkspaceIsolationMode {
  // Unspecified - uses configuration default (direct).
  WORKSPACE_ISOLATION_MODE_UNSPECIFIED = 0;

  // Direct mode: workspace is mounted directly with specified read/write access.
  // Changes are immediately visible on the host filesystem.
  // This is the simplest mode but provides no rollback capability.
  WORKSPACE_ISOLATION_MODE_DIRECT = 1;

  // Overlay mode: workspace uses a copy-on-write overlay filesystem.
  // Writes go to a temporary upper layer, leaving the original workspace intact.
  // Changes can be reviewed before committing or discarded entirely.
  // Requires: Docker with overlay2 driver, or Linux with overlayfs.
  WORKSPACE_ISOLATION_MODE_OVERLAY = 2;

  // Snapshot mode: workspace is copied to a temporary directory.
  // All operations run on the copy. Changes can be diff'd against original
  // and selectively applied. Best for git repositories where you want to
  // review changes before committing.
  WORKSPACE_ISOLATION_MODE_SNAPSHOT = 3;

  // Git worktree mode: creates a git worktree for isolation.
  // Requires the workspace to be a git repository.
  // Changes are isolated in a separate worktree that can be merged or discarded.
  WORKSPACE_ISOLATION_MODE_GIT_WORKTREE = 4;

  // Tmpfs overlay mode: uses in-memory tmpfs for the overlay upper layer.
  // Fastest for ephemeral operations but limited by available RAM.
  // All changes are lost when the sandbox exits.
  WORKSPACE_ISOLATION_MODE_TMPFS = 5;
}

// FileMaskMode controls how masked files appear to the sandbox.
enum FileMaskMode {
  // Unspecified - uses default (hidden).
  FILE_MASK_MODE_UNSPECIFIED = 0;

  // Hidden: masked files are completely invisible to the sandbox.
  // The sandbox cannot see these files exist at all.
  FILE_MASK_MODE_HIDDEN = 1;

  // Empty: masked files appear as empty (zero-byte) files.
  // The sandbox can see filenames but not contents.
  FILE_MASK_MODE_EMPTY = 2;

  // Placeholder: masked files contain a placeholder message.
  // Useful for debugging to indicate why content is unavailable.
  FILE_MASK_MODE_PLACEHOLDER = 3;

  // Read-only: files are visible and readable but writes are blocked.
  // Useful for configuration files that should be readable but not modified.
  FILE_MASK_MODE_READ_ONLY = 4;
}

// ExecutionSource identifies what triggered the sandbox execution.
// Used for policy evaluation and audit logging.
enum ExecutionSource {
  // Unspecified source.
  EXECUTION_SOURCE_UNSPECIFIED = 0;

  // Inventory extractor plugin.
  // Sandbox is running a plugin to extract package information.
  EXECUTION_SOURCE_PLUGIN = 1;

  // AI agent execution.
  // Sandbox is running an AI agent (Claude, Codex, etc.).
  EXECUTION_SOURCE_AGENT = 2;

  // Remediation execution (deputy fix --apply).
  // Sandbox is applying vulnerability fixes.
  EXECUTION_SOURCE_REMEDIATION = 3;

  // Deputy exec command.
  // User explicitly ran a sandboxed command via `deputy exec`.
  EXECUTION_SOURCE_EXEC = 4;

  // Server-side execution.
  // Sandbox is running in a multi-tenant server environment.
  EXECUTION_SOURCE_SERVER = 5;
}

// ListRuntimesRequest queries available sandbox runtimes.
message ListRuntimesRequest {
  // If true, include runtimes that are not currently available
  // (e.g., Docker not running) with unavailable_reason set.
  bool include_unavailable = 1;
}

// ListRuntimesResponse returns available sandbox runtimes.
message ListRuntimesResponse {
  // Available (and optionally unavailable) runtimes.
  repeated RuntimeInfo runtimes = 1;

  // Default runtime that will be used if none is specified.
  Runtime default_runtime = 2;
}

// RuntimeInfo describes an available sandbox runtime.
message RuntimeInfo {
  // Runtime identifier.
  Runtime runtime = 1;

  // Human-readable display name.
  string display_name = 2;

  // Runtime version (e.g., "24.0.5" for Docker).
  string version = 3;

  // Whether this runtime is currently available.
  bool available = 4;

  // Reason runtime is unavailable (if available=false).
  string unavailable_reason = 5;

  // Modes this runtime supports.
  repeated Mode supported_modes = 6;

  // Detailed capabilities.
  RuntimeCapabilities capabilities = 7;

  // For plugin runtimes: the plugin name.
  string plugin_name = 8;
}

// RuntimeCapabilities describes what a sandbox runtime can do.
message RuntimeCapabilities {
  // Can isolate network access.
  bool network_isolation = 1;

  // Can isolate filesystem access.
  bool filesystem_isolation = 2;

  // Can enforce resource limits (memory, CPU).
  bool resource_limits = 3;

  // Supports seccomp profiles (Linux).
  bool seccomp = 4;

  // Supports AppArmor profiles (Linux).
  bool apparmor = 5;

  // Supports SELinux (Linux).
  bool selinux = 6;

  // Supports user namespaces.
  bool user_namespaces = 7;

  // Can run rootless (without root/admin privileges).
  bool rootless = 8;

  // Supports GPU passthrough.
  bool gpu_support = 9;

  // Supports streaming stdout/stderr in real-time.
  bool streaming_output = 10;

  // Supports interactive stdin.
  bool interactive_stdin = 11;
}

// GetCapabilitiesRequest queries capabilities for a specific runtime.
message GetCapabilitiesRequest {
  // Runtime to query.
  Runtime runtime = 1;
}

// GetCapabilitiesResponse returns runtime capabilities.
message GetCapabilitiesResponse {
  // Detailed capabilities.
  RuntimeCapabilities capabilities = 1;

  // Human-readable description of limitations.
  repeated string limitations = 2;
}

// ExecuteRequest specifies a sandboxed execution.
message ExecuteRequest {
  // Command to execute. First element is the executable, rest are arguments.
  repeated string command = 1 [(buf.validate.field).repeated.min_items = 1];

  // Sandbox configuration.
  SandboxConfig config = 2;

  // Working directory inside the sandbox.
  // If unset, defaults to the workspace root (/workspace in containers).
  string work_dir = 3;

  // Environment variables to set.
  map<string, string> env = 4;

  // Stdin content (if any).
  bytes stdin = 5;

  // Timeout for execution.
  // After this duration, the sandbox will be terminated.
  google.protobuf.Duration timeout = 6;

  // Execution context for policy evaluation and audit.
  ExecutionContext context = 7;

  // Workspace directory on the host to mount into the sandbox.
  // Required for most execution modes except MODE_FULL_ACCESS.
  string workspace_dir = 8 [(buf.validate.field).string.min_len = 1];
}

// SandboxConfig configures sandbox behavior.
message SandboxConfig {
  // Runtime to use.
  // If unspecified, uses the configured default (typically Docker).
  Runtime runtime = 1;

  // Filesystem access mode.
  Mode mode = 2;

  // Network access mode.
  NetworkMode network_mode = 3;

  // Container image for container runtimes.
  // If unset, uses a minimal default (alpine:latest).
  string image = 4;

  // Resource limits.
  ResourceLimits limits = 5;

  // Additional host paths to mount.
  // These are mounted in addition to the workspace.
  repeated Mount mounts = 6;

  // Network allowlist (when network_mode = ALLOWLIST).
  // List of allowed hosts/IPs, optionally with ports (e.g., "proxy.golang.org:443").
  repeated string network_allowlist = 7;

  // Linux capabilities to drop.
  // If empty, drops ALL capabilities by default for security.
  repeated string drop_capabilities = 8;

  // Linux capabilities to add back.
  // Only use when absolutely necessary.
  repeated string add_capabilities = 9;

  // Seccomp profile path (Linux).
  // If empty, uses the runtime's default profile.
  string seccomp_profile = 10;

  // User to run as inside the sandbox.
  // Format: "user" or "user:group" or numeric UID.
  string user = 11;

  // Group to run as inside the sandbox.
  string group = 12;

  // Paths to make read-only (in addition to mode defaults).
  repeated string read_only_paths = 13;

  // Paths to hide (make inaccessible) from the sandbox.
  repeated string hidden_paths = 14;

  // For plugin runtimes: the plugin name to use.
  string plugin_name = 15;

  // Extra runtime-specific options (key-value pairs).
  map<string, string> extra_options = 16;

  // Explicit allowlist of executable paths or directories.
  // Runtimes that restrict exec can use this to expand allowed executables.
  repeated string exec_allowlist = 17;

  // Workspace isolation mode for copy-on-write, snapshot, or overlay behavior.
  // When set, enables advanced isolation features beyond simple bind mounts.
  WorkspaceIsolationMode workspace_isolation = 18;

  // File masking configuration for hiding or protecting sensitive files.
  // Applied on top of workspace_isolation to provide fine-grained control.
  FileMaskConfig file_mask = 19;

  // Whether to enable post-execution review workflow.
  // When true, changes are held for review before being committed.
  bool review_before_commit = 20;

  // Detailed workspace isolation configuration.
  // Required when workspace_isolation is not DIRECT or UNSPECIFIED.
  WorkspaceIsolationConfig workspace_isolation_config = 21;

  // Two-phase execution configuration for supply chain security.
  // When enabled, dependencies are pre-fetched with network access,
  // then the build runs offline without network access.
  TwoPhaseExecutionConfig two_phase_config = 22;

  // Network connection audit mode.
  // When enabled, logs blocked (and optionally allowed) network connections.
  NetworkAuditMode network_audit = 23;

  // Allocate a pseudo-TTY for the sandbox.
  // When true, enables interactive terminal mode with proper signal handling.
  // Required for commands that need a terminal (e.g., interactive shells, editors).
  bool allocate_tty = 24;

  // Connect stdin to the sandbox.
  // When true, allows interactive input from the terminal.
  // Usually combined with allocate_tty for interactive sessions.
  bool attach_stdin = 25;
}

// TwoPhaseExecutionConfig enables secure two-phase execution for builds.
// Phase 1 (Pre-fetch): Run dependency resolution commands with network access.
// Phase 2 (Build): Run the actual build offline (network disabled).
//
// This prevents supply chain attacks where malicious code exfiltrates data
// or downloads additional payloads during the build phase.
//
// Example workflow:
//   Phase 1: "go mod download" (network allowed, no code execution)
//   Phase 2: "go build" (offline, safe from network-based attacks)
message TwoPhaseExecutionConfig {
  // Enable two-phase execution mode.
  bool enabled = 1;

  // Pre-fetch commands to run in phase 1 (with network access).
  // Each command should only download dependencies, not execute user code.
  // Common examples:
  //   Go: ["go", "mod", "download"]
  //   Node: ["npm", "ci"]
  //   Python: ["pip", "download", "-r", "requirements.txt", "-d", ".wheels"]
  //   Rust: ["cargo", "fetch"]
  repeated string prefetch_command = 2;

  // Timeout for the pre-fetch phase.
  // Default: 10 minutes.
  google.protobuf.Duration prefetch_timeout = 3;

  // Network allowlist for pre-fetch phase (optional).
  // If set, overrides the main network_allowlist for phase 1.
  // Useful to restrict pre-fetch to known package registries.
  repeated string prefetch_network_allowlist = 4;

  // Whether to verify dependency checksums after pre-fetch.
  // When enabled, the plugin checks go.sum, package-lock.json, etc.
  // and fails if checksums don't match.
  bool verify_checksums = 5;

  // Cache directory for downloaded dependencies.
  // If set, dependencies are cached here across executions.
  // Helps avoid repeated downloads for the same dependencies.
  string cache_dir = 6;

  // Whether to audit network connections during pre-fetch.
  // When enabled, all outbound connections are logged for review.
  bool audit_prefetch_network = 7;
}

// NetworkAuditMode controls network connection logging.
enum NetworkAuditMode {
  // Unspecified - no network audit logging (default).
  NETWORK_AUDIT_MODE_UNSPECIFIED = 0;

  // Log blocked connections only (DENY/DROP).
  // Useful for debugging allowlist issues.
  NETWORK_AUDIT_MODE_BLOCKED = 1;

  // Log all connections (ALLOW and DROP).
  // Verbose mode for full visibility into network activity.
  NETWORK_AUDIT_MODE_ALL = 2;
}

// NetworkAuditEntry represents a single audited network connection.
message NetworkAuditEntry {
  // Action taken: "ALLOW" or "DROP"
  string action = 1;

  // Protocol: "TCP", "UDP", "ICMP", etc.
  string protocol = 2;

  // Destination IP address
  string destination = 3;

  // Destination port (0 if not applicable)
  int32 port = 4;

  // Timestamp when the connection was attempted
  google.protobuf.Timestamp timestamp = 5;
}

// FileMaskConfig configures file masking behavior for the sandbox.
// File masking allows you to selectively hide or protect files while still
// providing access to necessary files like dependency lockfiles.
message FileMaskConfig {
  // Default mask mode for files not explicitly configured.
  FileMaskMode default_mode = 1;

  // Patterns for files to mask (hide, make empty, or protect).
  // Uses glob patterns (e.g., "**/.env", "*.pem", ".git/config").
  repeated FileMaskRule mask_rules = 2;

  // Patterns for files to always expose (whitelist).
  // These override mask_rules. Useful for dependency lockfiles.
  // Uses glob patterns (e.g., "package-lock.json", "go.sum", "Cargo.lock").
  repeated string expose_patterns = 3;

  // Preset masks for common supply chain security scenarios.
  // These are additive with mask_rules.
  repeated FileMaskPreset presets = 4;
}

// FileMaskRule defines a masking rule for specific file patterns.
message FileMaskRule {
  // Glob pattern for files this rule applies to.
  // Examples: "**/.env*", "*.key", ".git/**", "node_modules/**"
  string pattern = 1;

  // How to mask matching files.
  FileMaskMode mode = 2;

  // Optional reason for masking (shown when mode is PLACEHOLDER).
  string reason = 3;
}

// FileMaskPreset defines predefined file masking configurations.
enum FileMaskPreset {
  // Unspecified preset.
  FILE_MASK_PRESET_UNSPECIFIED = 0;

  // Secrets preset: masks common secret files (.env, *.pem, *.key, credentials.json).
  FILE_MASK_PRESET_SECRETS = 1;

  // Git preset: masks git internal files except lockfiles and config for commits.
  FILE_MASK_PRESET_GIT = 2;

  // IDE preset: masks IDE/editor config files (.vscode/, .idea/, *.swp).
  FILE_MASK_PRESET_IDE = 3;

  // Build artifacts preset: masks common build outputs (dist/, build/, target/).
  FILE_MASK_PRESET_BUILD_ARTIFACTS = 4;

  // Node modules preset: masks node_modules except package metadata.
  FILE_MASK_PRESET_NODE_MODULES = 5;

  // Supply chain preset: combines secrets + build artifacts + strict lockfile access.
  // Recommended for AI agents and automated remediation.
  FILE_MASK_PRESET_SUPPLY_CHAIN = 6;
}

// WorkspaceIsolationConfig provides detailed configuration for workspace isolation.
// Used when workspace_isolation is set to a non-direct mode.
message WorkspaceIsolationConfig {
  // Workspace isolation mode.
  WorkspaceIsolationMode mode = 1;

  // For OVERLAY mode: size limit for the overlay upper layer.
  // Example: "1g", "512m". Default is "1g".
  string overlay_size_limit = 2;

  // For SNAPSHOT mode: directory to store snapshots.
  // Default is a temporary directory.
  string snapshot_dir = 3;

  // For GIT_WORKTREE mode: branch name for the worktree.
  // Default is a generated name based on execution ID.
  string worktree_branch = 4;

  // Whether to preserve the isolated workspace after execution.
  // Useful for debugging or manual review.
  bool preserve_after_execution = 5;

  // Maximum time to wait for snapshot/overlay setup.
  // Default is 60 seconds.
  google.protobuf.Duration setup_timeout = 6;

  // Files to sync back to original workspace after execution.
  // Uses glob patterns. If empty and review_before_commit is false,
  // syncs all modified files.
  repeated string sync_patterns = 7;

  // Files to never sync back (even if modified).
  // Uses glob patterns. Applied after sync_patterns.
  repeated string exclude_sync_patterns = 8;
}

// ResourceLimits sets resource constraints for the sandbox.
message ResourceLimits {
  // Memory limit (e.g., "512m", "2g").
  // Empty means no limit.
  string memory = 1;

  // CPU limit (e.g., "1.0" = 1 core, "0.5" = half core).
  // Empty means no limit.
  string cpu = 2;

  // Maximum number of processes/threads.
  // 0 means no limit.
  int32 max_pids = 3;

  // Maximum number of open files.
  // 0 means no limit.
  int32 max_files = 4;

  // Disk quota in bytes.
  // 0 means no limit.
  int64 disk_quota = 5;

  // Maximum execution time.
  // This overrides the timeout in ExecuteRequest if shorter.
  google.protobuf.Duration max_time = 6;
}

// Mount describes a host path to mount in the sandbox.
message Mount {
  // Host path to mount.
  string source = 1 [(buf.validate.field).string.min_len = 1];

  // Path inside the sandbox.
  string target = 2 [(buf.validate.field).string.min_len = 1];

  // Mount as read-only.
  bool read_only = 3;

  // Mount type (bind, tmpfs, etc.).
  // If empty, defaults to "bind".
  string type = 4;

  // Mount options (e.g., "noexec", "nosuid").
  repeated string options = 5;
}

// ExecutionContext provides context for policy evaluation and audit.
message ExecutionContext {
  // What triggered this execution.
  ExecutionSource source = 1;

  // Plugin name (for EXECUTION_SOURCE_PLUGIN).
  string plugin_name = 2;

  // Agent name (for EXECUTION_SOURCE_AGENT).
  string agent_name = 3;

  // Command being wrapped (for EXECUTION_SOURCE_EXEC).
  string wrapped_command = 4;

  // JWT claims from authenticated request (for server-side execution).
  map<string, string> jwt_claims = 5;

  // Tenant ID for multi-tenant server deployments.
  string tenant_id = 6;

  // Additional metadata for policy evaluation.
  map<string, string> metadata = 7;

  // Trace context for distributed tracing (W3C format).
  string trace_context = 8;
}

// ExecuteEvent streams execution progress and output.
message ExecuteEvent {
  // Unique identifier for this execution.
  string execution_id = 1;

  // When this event occurred.
  google.protobuf.Timestamp timestamp = 2;

  // Event details.
  oneof details {
    StartedEvent started = 10;
    OutputEvent output = 11;
    StatusEvent status = 12;
    CompletedEvent completed = 13;
    ErrorEvent error = 14;
    WorkspaceChangesEvent workspace_changes = 15;
  }
}

// StartedEvent signals that sandbox execution has started.
message StartedEvent {
  // Execution ID (same as in ExecuteEvent).
  string execution_id = 1;

  // Runtime being used.
  Runtime runtime = 2;

  // Container/sandbox ID (for container runtimes).
  string container_id = 3;

  // Effective configuration after applying defaults and policy overrides.
  SandboxConfig effective_config = 4;
}

// OutputEvent contains stdout/stderr output.
message OutputEvent {
  // True if this is stderr output.
  bool is_stderr = 1;

  // Output data.
  bytes data = 2;
}

// StatusEvent provides progress updates.
message StatusEvent {
  // Status message.
  string status = 1;

  // Detailed message.
  string message = 2;

  // Progress percentage (0-100), -1 if unknown.
  int32 progress_percent = 3;
}

// CompletedEvent signals that execution finished.
message CompletedEvent {
  // Exit code from the command.
  int32 exit_code = 1;

  // Total execution duration.
  google.protobuf.Duration duration = 2;

  // Resource usage statistics.
  ResourceUsage resource_usage = 3;
}

// ErrorEvent reports an error during execution.
message ErrorEvent {
  // Error message.
  string message = 1;

  // Error code for programmatic handling.
  string code = 2;

  // Whether this error is fatal (execution cannot continue).
  bool is_fatal = 3;

  // Whether retrying might succeed.
  bool is_retriable = 4;

  // Actionable guidance for resolving the error.
  // This provides human-readable suggestions for fixing the issue.
  string remediation = 5;

  // Documentation URL for more information about this error.
  string docs_url = 6;
}

// WorkspaceChangesEvent reports file changes in the workspace after execution.
// Sent when review_before_commit is enabled to allow the user to review changes.
message WorkspaceChangesEvent {
  // List of file changes detected.
  repeated FileChange changes = 1;

  // Total count of changes.
  int32 total_changes = 2;

  // Path to the isolated workspace (for diff viewing).
  string isolated_path = 3;

  // Path to the original workspace.
  string original_path = 4;
}

// ResourceUsage reports resources consumed during execution.
message ResourceUsage {
  // Peak memory usage in bytes.
  int64 peak_memory_bytes = 1;

  // Total CPU time consumed.
  google.protobuf.Duration cpu_time = 2;

  // Total bytes read.
  int64 bytes_read = 3;

  // Total bytes written.
  int64 bytes_written = 4;
}

// GetRuntimeInfoRequest is sent to external sandbox runtime plugins.
message GetRuntimeInfoRequest {}

// GetRuntimeInfoResponse contains plugin metadata.
message GetRuntimeInfoResponse {
  // Plugin name (should match the deputy-sandbox-<name> executable name).
  string name = 1 [(buf.validate.field).string.min_len = 1];

  // Human-readable display name.
  string display_name = 2;

  // Plugin version.
  string version = 3;

  // Description of this runtime.
  string description = 4;

  // Capabilities this runtime provides.
  RuntimeCapabilities capabilities = 5;

  // Modes this runtime supports.
  repeated Mode supported_modes = 6;
}

// RuntimeExecuteRequest is sent to external sandbox runtime plugins.
// It's similar to ExecuteRequest but includes the resolved workspace path.
message RuntimeExecuteRequest {
  // Command to execute.
  repeated string command = 1 [(buf.validate.field).repeated.min_items = 1];

  // Sandbox configuration.
  SandboxConfig config = 2;

  // Working directory inside the sandbox.
  string work_dir = 3;

  // Environment variables.
  map<string, string> env = 4;

  // Stdin content.
  bytes stdin = 5;

  // Timeout.
  google.protobuf.Duration timeout = 6;

  // Workspace directory (absolute path on host).
  string workspace_dir = 7;

  // Execution ID assigned by the manager.
  string execution_id = 8;

  // Trace context for distributed tracing.
  string trace_context = 9;
}

// CleanupRequest asks a runtime plugin to clean up after an execution.
message CleanupRequest {
  // Execution ID to clean up.
  string execution_id = 1 [(buf.validate.field).string.min_len = 1];
}

// CleanupResponse confirms cleanup.
message CleanupResponse {
  // Whether cleanup was successful.
  bool success = 1;

  // Error message if cleanup failed.
  string error = 2;
}

// SyncChangesRequest requests syncing workspace changes to the original location.
message SyncChangesRequest {
  // Execution ID whose changes should be synced.
  string execution_id = 1 [(buf.validate.field).string.min_len = 1];

  // Optional: Only sync files matching these glob patterns.
  // If empty, all changes are synced.
  repeated string include_patterns = 2;

  // Optional: Exclude files matching these glob patterns.
  repeated string exclude_patterns = 3;
}

// SyncChangesResponse confirms the sync operation.
message SyncChangesResponse {
  // Whether sync was successful.
  bool success = 1;

  // Error message if sync failed.
  string error = 2;

  // Number of files synced.
  int32 files_synced = 3;

  // List of files that were synced.
  repeated string synced_files = 4;
}

// GetChangesRequest requests the list of changed files.
message GetChangesRequest {
  // Execution ID to get changes for.
  string execution_id = 1 [(buf.validate.field).string.min_len = 1];
}

// GetChangesResponse returns the list of changed files.
message GetChangesResponse {
  // List of file changes.
  repeated FileChange changes = 1;

  // Total count of changes.
  int32 total_changes = 2;
}

// FileChange describes a single file change in the workspace.
message FileChange {
  // Path relative to workspace root.
  string path = 1;

  // Type of change: "added", "modified", "deleted", "renamed".
  string change_type = 2;

  // Size in bytes (0 for deleted files).
  int64 size = 3;

  // For renamed files, the old path.
  string old_path = 4;
}
