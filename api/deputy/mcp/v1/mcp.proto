syntax = "proto3";

package deputy.mcp.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/temporalio/deputy/gen/deputy/mcp/v1;mcpv1";

// deputy.mcp.v1 defines the input and output contracts of Deputy's MCP tools.
// These messages ARE the tool contracts: handlers marshal results with
// protojson (camelCase, zero values omitted — absent means empty/zero), and
// the tools' JSON Schemas are derived from these descriptors, so the
// advertised schema, the wire, and the server can never drift apart.
//
// Design notes:
//   - Enum-like fields are strings constrained with (buf.validate.field)
//     string.in lists rather than proto enums, so the wire keeps the
//     agent-friendly lowercase values ("malware", "package") instead of
//     protojson's enum value names. The schema generator derives JSON-Schema
//     enums from the same lists.
//   - Counts and durations use int32 so protojson emits JSON numbers
//     (protojson serializes 64-bit integers as strings).
//   - These are agent-curated projections; the full normalized data lives in
//     the service protos (deputy.scan.v1, deputy.triage.v1, …) that the CLI
//     and API emit.

// VulnExplanation is the agent-facing projection of an advisory occurrence:
// identity, severity, provenance, and remediation in a compact form, with
// reference lists truncated for context-window economy.
message VulnExplanation {
  // Id is the primary vulnerability identifier (e.g. CVE-2021-44228).
  string id = 1;
  // Aliases are alternative identifiers for the same vulnerability.
  repeated string aliases = 2;
  // Summary is a brief description of the vulnerability.
  string summary = 3;
  // Details is the full vulnerability description, included only when the
  // caller asked for details.
  string details = 4;
  // Kind distinguishes malware from ordinary vulnerabilities. Absent means
  // vulnerability.
  string kind = 5 [(buf.validate.field).string = {in: ["vulnerability", "malware"]}, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  // Severity is the normalized severity level.
  string severity = 6 [(buf.validate.field).string = {in: ["CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"]}, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  // SeverityType is the scoring system the severity came from (e.g. CVSS_V3,
  // GHSA) when known.
  string severity_type = 7;
  // Sources names the advisory source(s) that reported this finding (e.g.
  // "osv"); multiple entries mean independent corroboration.
  repeated string sources = 8;
  // FixedVersions are versions containing a fix on the dependency's own
  // module path.
  repeated string fixed_versions = 9;
  // PackageFixes records fixed versions per affected module path, including
  // sibling modules such as a Go major-version migration target.
  repeated PackageFix package_fixes = 10;
  // ResolvedFix is the verified remediation verdict when fix resolution ran.
  FixVerdict resolved_fix = 11;
  // References are URLs with additional information, truncated to a compact
  // sample; use referenceCount and referencesTruncated to detect sampling.
  repeated string references = 12;
  // ReferenceCount is the total number of references before truncation.
  int32 reference_count = 13;
  // ReferencesTruncated reports whether references were truncated.
  bool references_truncated = 14;
  // Published is when the advisory was first published (RFC 3339).
  string published = 15;
  // Modified is when the advisory was last updated (RFC 3339).
  string modified = 16;
}

// PackageFix records fixed versions for one affected module path.
message PackageFix {
  // Module is the module path the fix applies to.
  string module = 1;
  // Ecosystem is the module's package ecosystem.
  string ecosystem = 2;
  // FixedVersions are the versions of the module containing the fix.
  repeated string fixed_versions = 3;
}

// FixVerdict is the resolved remediation verdict for a finding.
message FixVerdict {
  // Status is the verdict: in_place (upgrade on the same module path),
  // migration (fix lives on a different module path), unavailable, or
  // unverified (advisory claim not checked).
  string status = 1 [(buf.validate.field).string = {in: ["in_place", "migration", "unavailable", "unverified", "unknown"]}, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  // Version is the version to install.
  string version = 2;
  // TargetModule is the module path to migrate to when status is migration.
  string target_module = 3;
  // Claimed is the advisory-claimed fixed version when it differs from the
  // verified one.
  string claimed = 4;
}

// Coverage reports which (ecosystem, artifact) combinations advisory sources
// answered for, and which had none. Uncovered means not-checked, not safe.
message Coverage {
  // Covered lists combinations at least one advisory source answered for.
  repeated CoverageEntry covered = 1;
  // Uncovered lists combinations no configured source could answer for (for
  // example container base images).
  repeated CoverageEntry uncovered = 2;
}

// CoverageEntry is one (ecosystem, artifact) coverage record.
message CoverageEntry {
  // Ecosystem is the package ecosystem (canonical name, e.g. "go", "npm").
  string ecosystem = 1;
  // Artifact is the artifact kind these packages represent.
  string artifact = 2 [(buf.validate.field).string = {in: ["package", "os_package", "container_image_ref", "github_action", "unspecified"]}, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  // Sources names the advisory sources that answered for this combination;
  // empty in an uncovered entry.
  repeated string sources = 3;
  // PackageCount is how many scanned packages fell into this combination.
  int32 package_count = 4;
}

// ScanDirectoryRequest asks for a vulnerability scan of a local directory.
message ScanDirectoryRequest {
  // Path to the local directory to scan.
  string path = 1 [(buf.validate.field).required = true, (buf.validate.field).string = {min_len: 1, pattern: "\\S"}];
  // Git reference, branch, tag, or commit for repository paths. Defaults to
  // the current working tree/HEAD.
  string ref = 2;
  // Optional ecosystems to scan, e.g. go, npm, pypi. Scans all if empty.
  repeated string ecosystems = 3;
  // Optional directory globs to skip during the walk, e.g. .bin/** or
  // **/testdata.
  repeated string exclude_paths = 4;
}

// ScanDirectoryResult summarizes a directory scan: severity totals that always
// sum to the vulnerability count, compact per-finding explanations, and
// advisory-source coverage.
message ScanDirectoryResult {
  // Path is the scanned directory.
  string path = 1;
  // Ref is the requested Git reference when the path is a repository.
  string ref = 2;
  // EffectiveRef is the resolved reference that was actually scanned.
  string effective_ref = 3;
  // Commit is the resolved commit hash of the scanned snapshot.
  string commit = 4;
  // PackagesScanned is the number of packages analyzed.
  int32 packages_scanned = 5;
  // VulnerabilitiesBySeverity counts unique findings per severity level,
  // including an "unknown" bucket so the counts sum to the total.
  map<string, int32> vulnerabilities_by_severity = 6;
  // Vulnerabilities are the consolidated findings.
  repeated VulnExplanation vulnerabilities = 7;
  // Clean reports whether no vulnerabilities were found — success, not an
  // error. Check coverage to see what was and was not checked.
  bool clean = 8;
  // Coverage reports advisory-source coverage for the scanned inventory.
  Coverage coverage = 9;
  // ScanTime is the elapsed scan time as a human-readable duration.
  string scan_time = 10;
  // ScanTimeMs is the elapsed scan time in milliseconds.
  int32 scan_time_ms = 11;
}

// ScanContainerRequest asks for a vulnerability scan of a container image.
message ScanContainerRequest {
  // Container image reference, e.g. nginx:1.25, ghcr.io/owner/app:v1.0.0, or
  // docker-daemon://myapp:latest.
  string image = 1 [(buf.validate.field).required = true, (buf.validate.field).string = {min_len: 1, pattern: "\\S"}];
  // Target platform, e.g. linux/amd64 or linux/arm64. Defaults to the current
  // platform.
  string platform = 2;
}

// ScanContainerResult summarizes a container image scan.
message ScanContainerResult {
  // Image is the scanned image reference.
  string image = 1;
  // Platform is the scanned platform when one was selected.
  string platform = 2;
  // PackagesScanned is the number of packages analyzed.
  int32 packages_scanned = 3;
  // VulnerabilitiesBySeverity counts unique findings per severity level,
  // including an "unknown" bucket so the counts sum to the total.
  map<string, int32> vulnerabilities_by_severity = 4;
  // Vulnerabilities are the consolidated findings.
  repeated VulnExplanation vulnerabilities = 5;
  // Clean reports whether no vulnerabilities were found — success, not an
  // error. Check coverage to see what was and was not checked.
  bool clean = 6;
  // Coverage reports advisory-source coverage for the scanned inventory.
  Coverage coverage = 7;
  // ScanTime is the elapsed scan time as a human-readable duration.
  string scan_time = 8;
  // ScanTimeMs is the elapsed scan time in milliseconds.
  int32 scan_time_ms = 9;
}

// TriageRequest asks for a prioritized vulnerability summary of a directory.
message TriageRequest {
  // Path to the local directory to analyze.
  string path = 1 [(buf.validate.field).required = true, (buf.validate.field).string = {min_len: 1, pattern: "\\S"}];
  // Git reference, branch, tag, or commit for repository paths. Defaults to
  // the current working tree/HEAD.
  string ref = 2;
  // Optional ecosystems to include, e.g. go, npm, pypi.
  repeated string ecosystems = 3;
  // Optional directory globs to skip during the walk, e.g. .bin/** or
  // **/testdata.
  repeated string exclude_paths = 4;
}

// TriagedVuln is one prioritized finding: identity plus the canonical triage
// verdict (severity + fixability + directness) shared with the CLI and API.
message TriagedVuln {
  // Id is the primary vulnerability identifier.
  string id = 1;
  // Kind distinguishes malware from ordinary vulnerabilities. Absent means
  // vulnerability.
  string kind = 2 [(buf.validate.field).string = {in: ["vulnerability", "malware"]}, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  // Severity is the normalized severity level.
  string severity = 3 [(buf.validate.field).string = {in: ["CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"]}, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  // SeverityType is the scoring system the severity came from when known.
  string severity_type = 4;
  // Sources names the advisory source(s) that reported this finding.
  repeated string sources = 5;
  // Package is the affected package name.
  string package = 6;
  // Version is the affected package version.
  string version = 7;
  // Purl is the package URL for exact follow-up with graph_why, graph_needs,
  // or scan_package.
  string purl = 8;
  // IsDirect reports whether the package is a direct dependency.
  bool is_direct = 9;
  // HasFix reports whether an actionable fix exists.
  bool has_fix = 10;
  // FixedVersions are versions containing a fix on the package's own module
  // path.
  repeated string fixed_versions = 11;
  // PackageFixes records fixed versions per affected module path.
  repeated PackageFix package_fixes = 12;
  // ResolvedFix is the verified remediation verdict when fix resolution ran.
  FixVerdict resolved_fix = 13;
  // Summary is a brief description of the vulnerability.
  string summary = 14;
  // Priority ranks this finding for remediation using the canonical triage
  // ladder: a critical finding with no fix ranks below a fixable one.
  string priority = 15 [(buf.validate.field).string = {in: ["critical", "high", "medium", "low"]}, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  // PriorityReason explains the priority verdict in one sentence.
  string priority_reason = 16;
}

// TriageResult is the prioritized summary of a directory's vulnerabilities.
message TriageResult {
  // Path is the analyzed directory.
  string path = 1;
  // Ref is the requested Git reference when the path is a repository.
  string ref = 2;
  // EffectiveRef is the resolved reference that was actually analyzed.
  string effective_ref = 3;
  // Commit is the resolved commit hash of the analyzed snapshot.
  string commit = 4;
  // TotalVulnerabilities is the number of unique findings.
  int32 total_vulnerabilities = 5;
  // CriticalCount counts findings with critical severity.
  int32 critical_count = 6;
  // HighCount counts findings with high severity.
  int32 high_count = 7;
  // MediumCount counts findings with medium severity.
  int32 medium_count = 8;
  // LowCount counts findings with low severity.
  int32 low_count = 9;
  // UnknownCount counts findings with unknown severity, so severity counts
  // sum to the total.
  int32 unknown_count = 10;
  // FixableCount counts findings with an actionable fix.
  int32 fixable_count = 11;
  // MigrationCount counts findings whose only fix is a module migration.
  int32 migration_count = 12;
  // UnfixableCount counts findings with no known fix.
  int32 unfixable_count = 13;
  // DirectVulnerabilities counts findings in direct dependencies.
  int32 direct_vulnerabilities = 14;
  // TransitiveVulnerabilities counts findings in transitive dependencies.
  int32 transitive_vulnerabilities = 15;
  // DirectFixableCount counts fixable findings in direct dependencies.
  int32 direct_fixable_count = 16;
  // TransitiveFixableCount counts fixable findings in transitive dependencies.
  int32 transitive_fixable_count = 17;
  // Vulnerabilities are the prioritized findings, most urgent first.
  repeated TriagedVuln vulnerabilities = 18;
  // Recommendations are actionable next steps derived from the findings.
  repeated string recommendations = 19;
}
