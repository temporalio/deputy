syntax = "proto3";

package deputy.plugin.v1;

import "buf/validate/validate.proto";
import "deputy/dependency/v1/dependency.proto";
import "deputy/vulnerability/v1/vulnerability.proto";

option go_package = "github.com/temporalio/deputy/gen/deputy/plugin/v1;pluginv1";

// AdvisorySourceService defines the interface for advisory sources: components
// that, given a set of packages, return known advisories (vulnerabilities and
// malware) affecting them.
//
// The built-in OSV source implements this same contract in-process; external
// sources (threat-feed APIs, vendor databases) implement it as pluginrpc
// subprocesses. Deputy aggregates results from all configured sources with
// union-with-provenance semantics, so a package's findings may be corroborated
// by more than one source.
service AdvisorySourceService {
  // Info returns the source's identity and declared coverage. Deputy calls it
  // once at startup to route queries only to sources that cover a package's
  // ecosystem and artifact kind.
  rpc Info(AdvisorySourceInfoRequest) returns (AdvisorySourceInfoResponse);
  // Query returns advisories affecting the supplied packages. A source must
  // ignore packages outside its declared coverage rather than erroring.
  rpc Query(AdvisoryQueryRequest) returns (AdvisoryQueryResponse);
}

// AdvisorySourceInfoRequest is the (empty) request for Info.
message AdvisorySourceInfoRequest {}

// AdvisorySourceInfoResponse carries the source's metadata.
message AdvisorySourceInfoResponse {
  // Info describes the source.
  AdvisorySourceInfo info = 1;
}

// AdvisorySourceInfo describes an advisory source and what it can answer for.
message AdvisorySourceInfo {
  // Name is the stable identifier recorded as finding provenance (e.g.
  // "osv"). It must stay comparable across releases: lowercase letters,
  // digits, and separators only.
  string name = 1 [(buf.validate.field).string = {min_len: 1, pattern: "^[a-z0-9][a-z0-9._-]*$"}];
  // DisplayName is a human-friendly name.
  string display_name = 2;
  // Description explains the source's coverage and provenance.
  string description = 3;
  // Version starts at 1 and must increase whenever the source's query
  // behavior changes, so cached results can be invalidated.
  int32 version = 4;
  // Capabilities declares what this source can answer for.
  SourceCapabilities capabilities = 5;
}

// SourceCapabilities declares the coverage a source advertises so Deputy can
// route only relevant packages to it and report gaps for the rest.
message SourceCapabilities {
  // Ecosystems are the canonical ecosystem names this source covers;
  // matching is case-insensitive. A source that declares no ecosystems
  // receives no queries.
  repeated string ecosystems = 1;
  // Artifacts are the artifact kinds this source can answer for. Empty means
  // all artifact kinds within the declared ecosystems.
  repeated deputy.vulnerability.v1.ArtifactKind artifacts = 2;
  // FindingKinds are the classes of finding this source produces. It is
  // informational and does not affect routing.
  repeated deputy.vulnerability.v1.FindingKind finding_kinds = 3;
}

// AdvisoryQueryRequest asks a source about a set of packages.
message AdvisoryQueryRequest {
  // Packages are the dependencies to look up.
  repeated deputy.dependency.v1.Package packages = 1;
}

// AdvisoryQueryResponse returns the advisories a source found.
message AdvisoryQueryResponse {
  // Findings are the per-package advisory occurrences, referencing advisories
  // by advisory ID.
  repeated deputy.vulnerability.v1.Finding findings = 1;
  // Advisories are the authoritative advisory records keyed by advisory ID.
  // When several sources return the same ID, the first registered source's
  // record wins.
  map<string, deputy.vulnerability.v1.Advisory> advisories = 2;
}
